<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd6ec">
<title>Rainbow Pony Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --u:1; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --hud:calc(64px * var(--u)); --nav:calc(88px * var(--u)); --rail:calc(96px * var(--u));
  --ink:#4b2f7a; --ink2:#7a5aa8; --pink:#ff5fa8; --pink2:#ff8fc8; --purple:#8a5cf6; --mint:#5ed2a0; --sky:#7fc8ff; --sun:#ffc93c;
  --panel:#fffaff; --panel2:#f6eeff; --line:#e8d8ff;
  --font:"Baloo 2", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --skyTop:#8FD3FF; --skyBot:#DFF5FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  font-family:var(--font);color:var(--ink);background:var(--skyTop);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img,svg{-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--skyTop),var(--skyBot))}
.hidden{display:none!important}
.layer{position:absolute;inset:0}

/* ---------- 3D chunky button ---------- */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-width:56px;min-height:56px;border-radius:22px;background:#fff;
  box-shadow:0 5px 0 var(--btnsh,#d9c6f5),0 8px 16px rgba(80,40,140,.18);transition:transform .08s,box-shadow .08s,filter .2s;font-weight:800}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--btnsh,#d9c6f5),0 3px 8px rgba(80,40,140,.15)}
.btn.round{border-radius:50%}
.btn.pink{background:linear-gradient(#ff8cc6,#ff5fa8);color:#fff;--btnsh:#d63d86}
.btn.green{background:linear-gradient(#7ee8a6,#3ccf7e);color:#fff;--btnsh:#23a05c}
.btn.purple{background:linear-gradient(#b49bff,#8a5cf6);color:#fff;--btnsh:#6236d6}
.btn.yellow{background:linear-gradient(#ffe27a,#ffc93c);color:#7a4a00;--btnsh:#e0a000}
.btn.blue{background:linear-gradient(#a6dcff,#5bb4ff);color:#fff;--btnsh:#2f86d6}
.btn.disabled{filter:grayscale(.85) opacity(.6)}
.btn svg{pointer-events:none}
.btn .lbl{font-size:calc(16px*var(--u));line-height:1}
.back-btn{position:absolute;left:calc(12px + var(--sal));top:calc(10px + var(--sat));width:calc(64px*var(--u));height:calc(64px*var(--u));z-index:30;background:#fff}
.back-btn svg{width:78%;height:78%}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:calc(var(--hud) + var(--sat));padding:calc(var(--sat) + 6px) calc(10px + var(--sar)) 0 calc(10px + var(--sal));
  display:flex;align-items:center;gap:calc(8px*var(--u));z-index:40;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s}
#hud>*{pointer-events:auto}
#hud.off{transform:translateY(-120%);opacity:0}
.pill{height:calc(48px*var(--u));border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;gap:4px;padding:0 calc(14px*var(--u)) 0 calc(4px*var(--u));
  box-shadow:0 4px 0 rgba(140,100,200,.25),0 6px 14px rgba(60,30,120,.15);font-weight:800;font-size:calc(24px*var(--u))}
.pill svg{width:calc(42px*var(--u));height:calc(42px*var(--u))}
#starPill .num{min-width:1.6em;text-align:left;color:#b8860b}
#lvl{position:relative;width:calc(56px*var(--u));height:calc(56px*var(--u));flex:none}
#lvl svg{position:absolute;inset:0;width:100%;height:100%}
#lvl .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(24px*var(--u));color:#fff;text-shadow:0 2px 0 #6236d6}
#hud .sp{flex:1}
#bagBtn,#gearBtn{width:calc(56px*var(--u));height:calc(56px*var(--u));flex:none}
#bagBtn svg,#gearBtn svg{width:80%;height:80%}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- NAV ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding:0 calc(6px + var(--sar)) var(--sab) calc(6px + var(--sal));
  display:flex;justify-content:space-around;align-items:center;z-index:40;background:linear-gradient(#fffaffee,#fff);border-radius:28px 28px 0 0;
  box-shadow:0 -6px 22px rgba(80,40,140,.16);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#nav.off{transform:translateY(130%)}
.nb{position:relative;width:calc(72px*var(--u));height:calc(76px*var(--u));min-width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;transition:background .2s}
.nb svg{width:calc(42px*var(--u));height:calc(42px*var(--u));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nb .lbl{font-size:calc(13px*var(--u));font-weight:800;color:var(--ink2);margin-top:1px;line-height:1.1}
.nb.on{background:linear-gradient(#ffe3f3,#f3e6ff);box-shadow:inset 0 0 0 3px #fff,0 4px 12px rgba(160,90,220,.25)}
.nb.on svg{transform:translateY(-4px) scale(1.12)}
.nb.on .lbl{color:var(--pink)}
.nb .badge{position:absolute;top:2px;right:6px;width:26px;height:26px;border-radius:50%;background:#ff4f9a;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px #fff;animation:badge 1.6s ease-in-out infinite}
.nb .badge svg{width:18px;height:18px;transform:none!important}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* landscape rail */
body.land #nav{top:0;right:auto;width:calc(var(--rail) + var(--sal));height:auto;flex-direction:column;border-radius:0 28px 28px 0;padding:calc(var(--sat) + 8px) 6px calc(var(--sab) + 8px) calc(6px + var(--sal));box-shadow:6px 0 22px rgba(80,40,140,.16)}
body.land #nav.off{transform:translateX(-130%)}
body.land .nb{height:auto;flex:1;max-height:84px;width:calc(80px*var(--u))}
body.land #hud{left:calc(var(--rail) + var(--sal));height:auto;padding-top:calc(var(--sat) + 8px)}

/* ---------- SCENES (world) ---------- */
.scene{position:absolute;left:0;right:0;top:calc(var(--hud) + var(--sat));bottom:calc(var(--nav) + var(--sab));overflow:hidden;touch-action:none;
  transition:opacity .35s}
body.land .scene{left:calc(var(--rail) + var(--sal));top:0;bottom:0}
.scene.gone{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.scene{visibility:visible}
.world{position:absolute;left:0;top:0;width:1200px;height:900px;transform-origin:0 0;will-change:transform}
.world .bgwrap{position:absolute;left:0;width:1200px;pointer-events:none}
.world .bgwrap svg{display:block;width:100%;height:100%}
.world .night{transition:opacity 1s}
.obj{position:absolute;left:0;top:0}
.obj>svg{display:block;width:100%;height:100%;overflow:visible}
.tint{position:absolute;inset:0;pointer-events:none;transition:opacity 2s}
.chev{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;z-index:5;pointer-events:none;opacity:.85;animation:chev 1.4s ease-in-out infinite}
.chev.l{left:6px}.chev.r{right:6px;animation-name:chevr}
.chev svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(60,30,120,.3))}
@keyframes chev{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes chevr{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.sideL,.sideR{position:absolute;top:0;bottom:0;pointer-events:none}

/* ---------- PONY VIEW ---------- */
.pv{position:absolute;left:0;top:0;pointer-events:none}
.pv-flip,.pv-jump{position:absolute;inset:0;transform-origin:50% 92%}

.pv svg.pony{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pv-over{position:absolute;inset:0;pointer-events:none}
.pv.lying .p-legs-back,.pv.lying .p-legs-front{display:none}
.pv.lying .p-root{transform:translateY(48px)!important;animation:none!important}
.pv.lying.st-young .p-root{transform:translateY(40px)!important}
.pv.lying.st-foal .p-root{transform:translateY(30px)!important}
.pv.glitter .pv-jump::after{content:"";position:absolute;inset:12% 10% 8% 8%;background:radial-gradient(circle,#fff 0 1.2px,transparent 2px) 0 0/14px 14px,radial-gradient(circle,#fff8b0 0 1px,transparent 2px) 7px 7px/18px 18px;
  -webkit-mask:radial-gradient(ellipse 45% 30% at 45% 62%,#000 60%,transparent 100%);mask:radial-gradient(ellipse 45% 30% at 45% 62%,#000 60%,transparent 100%);animation:glit 2s ease-in-out infinite;opacity:.9}
@keyframes glit{0%,100%{opacity:.4}50%{opacity:1}}
.pv.bestie .p-charm{filter:drop-shadow(0 0 3px #fff6a0)}
.pony.gloss .p-mane,.pony.gloss .p-tail{animation:gloss .6s ease-in-out 5!important}
@keyframes gloss{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) saturate(1.2)}}
.pony.eyesClosed .p-eyes{display:none}.pony.eyesClosed .p-eyes-closed{display:inline}
.pony.lite .p-body,.pony.lite .p-head,.pony.lite .p-mane{animation:none}
.cloudy{position:absolute;left:30%;top:-4%;width:40%;pointer-events:none}
.cloudy svg{width:100%}
.cloudy .drop{animation:rain 1.2s linear infinite}
@keyframes rain{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.needb{position:absolute;left:58%;top:-6%;width:34%;pointer-events:none;animation:needb 2s ease-in-out infinite;transform-origin:20% 100%}
.needb svg{width:100%;height:auto;display:block}
@keyframes needb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6%) scale(1.06)}}
.zz{position:absolute;font-weight:800;color:#8a7bff;-webkit-text-stroke:1px #fff;pointer-events:none}

/* ---------- FX canvas / overlays ---------- */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.flyer{position:absolute;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:75;pointer-events:none;will-change:transform}
.flyer svg{width:100%;height:100%}
#bubble{position:absolute;z-index:90;pointer-events:none;max-width:min(80vw,340px);background:#fff;border-radius:24px;padding:10px 18px;font-weight:800;font-size:calc(22px*var(--u));
  line-height:1.15;color:var(--ink);box-shadow:0 6px 0 rgba(140,100,200,.25),0 10px 24px rgba(60,30,120,.18);opacity:0;transform:scale(.6);transition:opacity .18s,transform .3s cubic-bezier(.3,1.6,.5,1);text-align:center}
#bubble.on{opacity:1;transform:scale(1)}
#bubble::after{content:"";position:absolute;left:var(--tx,50%);bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.top::after{bottom:auto;top:-12px;border-top:0;border-bottom:12px solid #fff}

/* hint hand */
#hand{position:absolute;left:0;top:0;width:calc(76px*var(--u));height:calc(76px*var(--u));z-index:95;pointer-events:none;display:none;margin:-6px 0 0 -18px}
#hand.on{display:block}
#hand .hi{width:100%;height:100%;animation:handTap 1.6s ease-in-out infinite;transform-origin:30% 10%}
#hand.pulse .hi{animation:handPulse .8s ease-in-out infinite alternate,handTap 1.6s ease-in-out infinite}
#hand svg{width:100%;height:100%;filter:drop-shadow(0 4px 4px rgba(40,20,80,.35))}
#hand .ring{position:absolute;left:12%;top:0;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;border:4px solid #fff;opacity:0;animation:ring 1.6s ease-out infinite}
@keyframes handTap{0%,60%,100%{transform:translate(0,0) scale(1)}70%{transform:translate(-4px,-10px) scale(.92)}80%{transform:translate(0,0) scale(.88)}}
@keyframes handPulse{from{scale:1}to{scale:1.15}}
@keyframes ring{0%,75%{opacity:0;transform:scale(.3)}80%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
#hand.drag .hi{animation:none}
#spot{position:absolute;z-index:90;pointer-events:none;border-radius:50%;box-shadow:0 0 0 200vmax rgba(40,20,80,.4);transition:all .35s ease;display:none}
#spot.on{display:block}

/* ---------- SHEETS / OVERLAYS ---------- */
.overlay{position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(50,25,90,.35)}
.sheet{position:absolute;left:50%;bottom:calc(var(--sab) + 12px);width:min(94vw,560px);transform:translate(-50%,120%);background:var(--panel);border-radius:32px;padding:18px 16px 18px;
  box-shadow:0 10px 0 #e2d0fb,0 20px 50px rgba(50,20,100,.3);transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
.overlay.on .sheet{transform:translate(-50%,0)}
.sheet h2{margin:0 0 10px;font-size:calc(26px*var(--u));text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.sheet h2 svg{width:42px;height:42px}
.sheet .x{position:absolute;right:10px;top:10px;width:56px;height:56px}
.sheet .x svg{width:100%;height:100%}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.tog{width:calc(100px*var(--u));height:calc(110px*var(--u));flex-direction:column;border-radius:26px}
.tog svg{width:56%;height:auto}
.tog.off{filter:grayscale(1) opacity(.55)}
.tog .lbl{margin-top:4px}

/* ---------- TITLE / PICK / NAME ---------- */
.screen{position:absolute;inset:0;z-index:50;overflow:hidden;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.screen.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .4s,visibility 0s}
.screen .bgfull{position:absolute;inset:0}
.screen .bgfull svg{width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.0),rgba(255,240,250,.25))}
#title .logo{position:absolute;left:50%;top:calc(var(--sat) + 6vh);transform:translateX(-50%);width:min(92vw,560px);animation:logo 3s ease-in-out infinite}
#title .logo svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes logo{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg) translateY(-6px)}}
#title .parade{position:absolute;left:0;right:0;bottom:24%;height:min(34vh,260px)}
#title .play{position:absolute;left:50%;bottom:calc(var(--sab) + 7vh);width:calc(132px*var(--u));height:calc(132px*var(--u));margin-left:calc(-66px*var(--u));border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
#title .play svg{width:62%;height:62%;margin-left:8%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.big-title{position:absolute;left:0;right:0;top:calc(var(--sat) + 18px);text-align:center;font-size:calc(34px*var(--u));font-weight:800;color:#fff;
  text-shadow:0 3px 0 #b05ad6,0 0 18px rgba(176,90,214,.6);letter-spacing:.5px;padding:0 70px}
#pick .picks{position:absolute;left:0;right:0;top:20%;bottom:16%;display:flex;align-items:flex-end;justify-content:center;gap:2vw}
#pick .pk{position:relative;flex:1;max-width:240px;height:100%;display:flex;align-items:flex-end;justify-content:center}
#pick .pk .pv{position:absolute;left:50%;top:auto;bottom:0}
#pick .pk .ped{position:absolute;bottom:-4%;left:8%;right:8%;height:16%;border-radius:50%;background:radial-gradient(ellipse,#fff8 0 40%,#fff0 70%)}
#pick .pk.chosen .ped{background:radial-gradient(ellipse,#fff6a0 0 40%,#fff0 70%)}
#name .stage{position:absolute;left:0;right:0;top:calc(var(--sat) + 70px);height:42%;display:flex;justify-content:center;align-items:flex-end}
#name .names{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 120px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 10px}
#name .nm{min-width:calc(100px*var(--u));height:calc(64px*var(--u));padding:0 18px;font-size:calc(24px*var(--u));border-radius:999px}
#name .nm.sel{background:linear-gradient(#ffd2ea,#ffa8d6);box-shadow:0 5px 0 #e57ab4,0 0 0 4px #fff inset}
#name .tools{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 20px);display:flex;justify-content:center;gap:14px}
#name .tools .btn{width:calc(78px*var(--u));height:calc(78px*var(--u))}
#name .tools .ok{width:calc(100px*var(--u))}
#name .tools svg{width:62%;height:62%}
#name input{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vw,320px);height:64px;border-radius:20px;border:4px solid var(--pink2);font:800 26px var(--font);text-align:center;color:var(--ink);
  user-select:text;-webkit-user-select:text;touch-action:auto;outline:none;z-index:5}
.plate{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 18px;font-weight:800;font-size:calc(26px*var(--u));box-shadow:0 4px 0 #e2d0fb}

/* ---------- CARE ---------- */
#care{background:linear-gradient(#cfe9ff,#fff0f8)}
#care .careBg{position:absolute;inset:0;opacity:.95}
#care .careBg svg{width:100%;height:100%}
#care .dim{position:absolute;inset:0;background:#0b0830;opacity:0;transition:opacity 1s;pointer-events:none;z-index:3}
#care.night .dim{opacity:.6}
#care .top{position:absolute;left:0;right:0;top:calc(var(--sat) + 8px);height:calc(72px*var(--u));display:flex;align-items:center;gap:8px;padding:0 calc(10px + var(--sar)) 0 calc(88px*var(--u) + var(--sal));z-index:10}
#care .back-btn{top:calc(var(--sat) + 12px)}
#care .nameplate{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;height:calc(58px*var(--u));padding:0 4px 0 16px;font-weight:800;font-size:calc(21px*var(--u));box-shadow:0 4px 0 #e2d0fb;max-width:60vw;min-width:0}
#care .nameplate .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#care .nameplate .ed{width:56px;height:56px;min-width:56px;min-height:56px;margin-right:-2px;border-radius:50%;box-shadow:none;background:#ffe3f3}
#care .nameplate .ed svg{width:70%;height:70%}
.hearts{display:flex;gap:1px;align-items:center}
.hearts .h{position:relative;width:calc(26px*var(--u));height:calc(26px*var(--u))}
#care .top .hearts .h{width:calc(21px*var(--u));height:calc(21px*var(--u))}
.hearts .h svg{position:absolute;inset:0;width:100%;height:100%}
.hearts .h .fill{position:absolute;inset:0;overflow:hidden}
#care .stats{position:absolute;left:0;right:0;top:calc(var(--sat) + 80px*var(--u));height:calc(80px*var(--u));display:flex;justify-content:center;gap:calc(14px*var(--u));z-index:10}
.meter{position:relative;width:calc(70px*var(--u));height:calc(70px*var(--u));border-radius:50%;background:#fff;box-shadow:0 4px 0 #e2d0fb,0 6px 14px rgba(60,30,120,.12)}
.meter svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.meter svg.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.3,1.3,.5,1)}
.meter .ic{position:absolute;inset:20%}
.meter .ic svg{width:100%;height:100%}
.meter.low{animation:lowm 1.4s ease-in-out infinite}
@keyframes lowm{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#care .stage{position:absolute;left:0;right:0;top:calc(var(--sat) + 166px*var(--u));bottom:calc(var(--sab) + 112px*var(--u));z-index:5;touch-action:none}
#care .oval{position:absolute;left:50%;bottom:4%;width:86%;height:16%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#9be88a,#5cc65a 70%,#4aaa4a);box-shadow:0 10px 0 #3f9a45,inset 0 6px 0 #b8f5a8}
#care .heroWrap{position:absolute;left:50%;bottom:7%;transform:translateX(-50%)}
#care .heroWrap .pv{position:relative}
#care .growth{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 #e2d0fb;z-index:6}
#care .growth svg{width:30px;height:30px}
#care .growth .bar{width:calc(90px*var(--u));height:12px;border-radius:6px;background:#eadcff;overflow:hidden}

/* seed tray / timer bubble (screen space over world) */
.pop{position:absolute;z-index:42;background:#fff;border-radius:26px;padding:10px;display:flex;gap:10px;box-shadow:0 6px 0 #e2d0fb,0 12px 30px rgba(60,30,120,.22);transform:translate(-50%,-100%) scale(.6);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}

.pie svg{width:44px;height:44px}

#fbag{position:absolute;left:50%;bottom:calc(var(--nav) + var(--sab) + 8px);transform:translateX(-50%);z-index:41;display:flex;gap:6px;background:rgba(255,255,255,.9);border-radius:26px;padding:6px 8px;box-shadow:0 5px 0 #d8c4f5,0 10px 24px rgba(60,30,120,.2);transition:transform .3s,opacity .3s}

#fbag .food svg{width:78%;height:78%}
#fbag{gap:4px!important;padding:5px 6px!important;max-width:calc(100vw - 8px)}
#fbag .sep{display:none}
#fbag .food.zero{filter:grayscale(1) opacity(.45)}
#fbag .sep{width:2px;background:#eadcff;margin:6px 0}
#fbag .jar{width:40px;height:58px;position:relative;display:flex;align-items:center;justify-content:center}
#fbag .jar svg{width:90%;height:90%}
#fbag .cnt{font-size:15px;min-width:24px;height:24px}

/* settings */
#settings .sheet{padding-top:22px}

/* debug */
#dbg{position:absolute;right:calc(8px + var(--sar));bottom:calc(var(--nav) + var(--sab) + 70px);z-index:99;font:12px/1.3 system-ui,sans-serif;color:#fff}
#dbg .t{width:56px;height:56px;border-radius:50%;background:rgba(40,20,80,.7);font-size:22px;display:flex;align-items:center;justify-content:center;margin-left:auto}
#dbg .p{background:rgba(30,15,60,.82);border-radius:12px;padding:8px;margin-bottom:6px;width:230px}
#dbg .p button{background:#8a5cf6;color:#fff;border-radius:8px;padding:6px 8px;margin:2px;font:600 12px system-ui;min-height:30px}
#dbg pre{margin:0 0 4px;white-space:pre-wrap;font:11px/1.3 ui-monospace,monospace}

/* transition wipe */
#wipe{position:absolute;inset:0;z-index:98;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fff 0 30%,#ffe6f6 60%,#e6dcff);transition:opacity .28s}
#wipe.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
}

/* ---------- world objects ---------- */
.obj .hb{position:absolute}

@keyframes giftBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

@keyframes ripe{0%,80%,100%{transform:translateY(0) scale(1)}88%{transform:translateY(-14px) scale(1.05,.95)}94%{transform:translateY(0) scale(1.1,.9)}}

.anim-sway .dIn{animation:sway 3s ease-in-out infinite}
.anim-float .dIn{animation:floatD 4s ease-in-out infinite}

@keyframes shim{0%,100%{transform:scale(1)}50%{transform:scale(1.03,1.05)}}

.obj>.fbtn{width:100%;height:100%;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #d9c6f5,0 8px 16px rgba(60,30,120,.2)}

.fbug .bugIn{width:100%;height:100%;animation:bugB .5s ease-in-out infinite alternate}
.fbug svg{position:absolute;left:10%;top:10%;width:80%;height:80%;filter:drop-shadow(0 0 10px #fff36a)}
@keyframes bugB{to{transform:translateY(-5px) rotate(6deg)}}
.hoof svg{position:absolute;left:13%;top:13%;width:74%;height:74%;opacity:.45;transform:rotate(var(--rot,0deg)) scaleY(.7)}

.hoof.next .hglow{opacity:.7}
@keyframes hoofP{0%,100%{transform:rotate(var(--rot,0deg)) scale(1,.7)}50%{transform:rotate(var(--rot,0deg)) scale(1.22,.86)}}
.wildObj{pointer-events:none;transition:opacity .4s}

.wildObj.hidden-wild{opacity:0}

.wildObj .wildThink{left:52%;top:4%;width:32%;display:block}
.wildQ{position:absolute;left:58%;top:12%;font-size:64px;font-weight:800;color:#fff;-webkit-text-stroke:3px #8a5cf6;animation:pulse .6s ease-in-out infinite}
.wildObj .pv{width:100%!important;height:100%!important}
.silObj .pv{width:100%!important;height:100%!important;filter:grayscale(1) sepia(.5) hue-rotate(215deg) saturate(2.2) brightness(1.12) contrast(.85) opacity(.88) drop-shadow(0 0 8px rgba(255,255,255,.9))}
.silObj .pv-jump{animation:silBreath 3.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes silBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
.silZ{position:absolute;left:72%;top:36%;pointer-events:none}

.silObj{pointer-events:none}.silObj .hb{pointer-events:auto}
.silTag{position:absolute;left:40%;top:8%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:4px 14px 4px 6px;font-size:24px;box-shadow:0 4px 0 #d9c6f5;white-space:nowrap}

.awayIn{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.awayIn .mn{position:absolute;right:-6px;top:-6px;width:44px;height:44px}
.fdrop svg{width:100%;height:100%;animation:bgTw 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff)}

.miniHeart{position:absolute;left:0;right:0;top:24%;z-index:84;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}

.miniHeart .mh svg{width:100%;height:100%}
.miniHeart .ttl{font-size:calc(38px*var(--u));font-weight:800;color:#fff;text-shadow:0 4px 0 #d63d86,0 0 18px rgba(214,61,134,.5)}
.miniHeart .hearts{transform:scale(1.5);margin-top:10px;background:#fff;border-radius:999px;padding:4px 10px;box-shadow:0 4px 0 #e2d0fb}

body.short #celebrate .tap{left:auto;right:calc(var(--sar) + 24px);transform:none;bottom:calc(var(--sab) + 20px)}
body.short #celebrate .ttl{font-size:34px}

body.land #title .play{bottom:calc(var(--sab) + 5vh);width:110px;height:110px;margin-left:-55px}

.pv.paused *{animation-play-state:paused!important}
.ponyObj .pony.lite .p-tail{animation-duration:3.6s}

#sheet .row{flex-wrap:nowrap;gap:6px}

/* ---------- image-rendered sprites (cheap DOM) ---------- */
img.simg{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;max-width:none}
.obj{position:absolute}
.world .bgwrap{position:absolute;overflow:hidden}
.world .bgwrap img.simg{left:0;top:0;width:100%;height:100%;object-fit:cover}
.pv-jump img.pimg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;pointer-events:none;-webkit-user-drag:none;max-width:none}
.decoObj .dIn{position:relative}
.treeIn{position:absolute;inset:0;transform-origin:50% 95%}
.glowbug{border-radius:50%;background:radial-gradient(circle,#fffbc0 0 12%,rgba(255,243,106,.85) 16%,rgba(255,243,106,0) 60%)}
.tw{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 22%,rgba(255,248,208,.5) 38%,rgba(255,248,208,0) 70%);animation:twk 2.6s ease-in-out infinite;will-change:opacity}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}

/* keep every looping farm/forest animation on its own compositor layer (no repaints) */
.decoObj[class*="anim-"]:not(.anim-none) .dIn,.plot .ripeC,.plot .canIn,.plot .crop .plus,.giftObj .giftIn,.chev,.needb,.cloudy,.bird,.berryOn,.fbug .bugIn,.hoof.next svg{will-change:transform}
.pv.glitter .pv-jump::after{animation:none;opacity:.85}

.obj.crystal>svg,.obj[data-hit^="crystal"]>svg{position:absolute;left:10%;bottom:0;width:80%;height:92%}

/* QA P1-5: every touch target >= 56px on all sizes */
.meter{min-width:56px;min-height:56px}

  <div id="farm" class="scene gone" data-scene="farm"></div>

      <circle cx="28" cy="28" r="26" fill="#fff"/><circle cx="28" cy="28" r="20" fill="url(#lvlg)"/>
      <circle class="track" cx="28" cy="28" r="23" fill="none" stroke="#efe6ff" stroke-width="5"/>

<script>
/* Rainbow Pony Farm — ART module. Plain JS, no imports. Defines global ART.
   All art is original, drawn in code as SVG strings. */
var ART = (function () {
  'use strict';
  var N = 0;
  function uid(p) { N++; return (p || 'a') + N.toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
  function f(n) { return Math.round(n * 10) / 10; }
  function pt(p) { return f(p[0]) + ',' + f(p[1]); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- color helpers ---------- */
  function rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
    var n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function hex(r, g, b) {
    return '#' + [r, g, b].map(function (v) { v = clamp(Math.round(v), 0, 255).toString(16); return v.length < 2 ? '0' + v : v; }).join('');
  }
  function toHsl(h) {
    var c = rgb(h), r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, s = 0, H = 0, d = mx - mn;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      H = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; H /= 6;
    }
    return [H, s, l];
  }
  function fromHsl(H, s, l) {
    function k(n) { var kk = (n + H * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(kk - 3, 9 - kk, 1)); }
    return hex(k(0) * 255, k(8) * 255, k(4) * 255);
  }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return hex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); }
  /* outline: darker, more saturated shade of the same hue (lavender-grey for whites) */
  function ink(h, amt) {
    var c = toHsl(h); amt = amt == null ? 1 : amt;
    if (c[1] < 0.12) { c[0] = 0.72; c[1] = 0.28; }
    return fromHsl(c[0], clamp(c[1] * 0.9 + 0.18, 0, 0.85), clamp(c[2] * (1 - 0.5 * amt) - 0.04 * amt, 0.12, 0.9));
  }
  function lite(h, t) { return mix(h, '#ffffff', t); }
  function shade(h, t) { var c = toHsl(h); return fromHsl(c[0], clamp(c[1] + t * 0.3, 0, 1), clamp(c[2] - t, 0, 1)); }

  /* ---------- geometry helpers ---------- */
  function cub(p, t) {
    var u = 1 - t;
    return [u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6],
            u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]];
  }
  function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  function smooth(P) {
    var n = P.length, s = 'M' + pt(mid(P[n - 1], P[0]));
    for (var i = 0; i < n; i++) s += 'Q' + pt(P[i]) + ' ' + pt(mid(P[i], P[(i + 1) % n]));
    return s + 'Z';

/* generic press-and-drag item from a tray button */
function dragItem(btn, ghostHtml, o) {
  btn.addEventListener('pointerdown', function (e) {
    if (!Tutorial.allow(btn)) { Tutorial.blocked(btn); return; }
    e.preventDefault(); Hints.poke();
    var sx = e.clientX, sy = e.clientY, ghost = null, moved = false, id = e.pointerId, hov = false;
    try { btn.setPointerCapture(id); } catch (er) { }
    btn.classList.add('pressed');
    var mv = function (ev) {
      if (ev.pointerId !== id) return;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        moved = true;
        if (!o.can()) { o.empty(); return; }
        ghost = el('div', 'drag-ghost', ghostHtml()); $('#app').appendChild(ghost); sfx('pop');
      }
      if (ghost) {
        ghost.style.transform = 'translate3d(' + ev.clientX + 'px,' + ev.clientY + 'px,0) scale(1.1)';
        var h = o.over(ev.clientX, ev.clientY); if (h !== hov) { hov = h; ghost.style.transform += h ? ' scale(1.2)' : ''; }
      }
    };
    var up = function (ev) {
      if (ev.pointerId !== id) return;
      btn.removeEventListener('pointermove', mv); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', up);
      btn.classList.remove('pressed');
      if (!moved) { if (!o.can()) o.empty(); else o.tap(); return; }
      if (!ghost) return;
      if (o.drop(ev.clientX, ev.clientY)) ghost.remove();
      else { var g = ghost, b = FX.screenOf(btn); g.animate([{ transform: g.style.transform }, { transform: 'translate3d(' + b.x + 'px,' + b.y + 'px,0) scale(.6)' }], { duration: 250 }).onfinish = function () { g.remove(); }; }
    };
    btn.addEventListener('pointermove', mv); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up);
  });
}

  reset: function () { Hints.last = Date.now(); Hints.forced = null; },
  hide: function () { if (!Tutorial.active()) Hand.hide(); },
  forceTarget: function (elm) { Hints.forced = elm; Hand.show(function () { return elm.offsetParent ? FX.screenOf(elm) : null; }, { pulse: true }); },
  check: function () {
    if (!S || Tutorial.active() || Celebrate.active || Sheets.isOpen() || Hand.on) return;
    var scr = UI.cur; if (['farm', 'forest', 'care', 'decor', 'pick', 'name'].indexOf(scr) < 0) return;
    if ((scr === 'pick' || scr === 'name') && Date.now() - Hints.last < 3500) return;
    if (scr !== 'pick' && scr !== 'name' && Date.now() - Hints.last < 8000) return;
    var t = Hints.target(scr); if (!t) return;
    Hand.show(t.get, { pulse: true });
    if (t.line && !Hints.spoken[t.id]) { Hints.spoken[t.id] = 1; Speech.say(t.line, { anchor: t.get() }); }
    Hints.last = Date.now();
  },
  wpt: function (world, wx, wy) { return function () { var p = world.toScreen(wx, wy); if (!world.visible(wx, 10)) { var left = wx < world.camX; return { x: left ? 30 : innerWidth - 70, y: world.toScreen(0, 700).y }; } return p; }; },
  elm: function (e) { return function () { return e && e.offsetParent !== null ? FX.screenOf(e) : null; }; },
  target: function (scr) {
    var F = Scenes.farm, W = F.world;
    if (scr === 'farm') {
      var ps = S.ponies.filter(function (p) { return Game.updateStage(p); })[0];
      if (ps && F.ponies[ps.id]) { var Fp = F.ponies[ps.id]; return { id: 'grow' + ps.id, get: Hints.wpt(W, Fp.x, Fp.y - 110), line: 'Look! I grew!' }; }
      if (Game.giftAvailable()) return { id: 'gift', get: Hints.wpt(W, FARM_L.gift.x, FARM_L.gift.y - 50), line: Speech.line('openGift') };
      for (var i = 0; i < 6; i++) { var st = Game.plotState(i); if (st.ripe) return { id: 'ripe', get: Hints.wpt(W, F.plots[i].el._x, F.plots[i].el._y - 40), line: Speech.line('tutPick') }; }
      var np = S.ponies.filter(function (p) { return Game.need(p); })[0];
      if (np && F.ponies[np.id]) { var Fn = F.ponies[np.id]; return { id: 'need', get: function () { return Hints.wpt(W, Fn.x, Fn.y - 110)(); }, line: Speech.line('tutTap') }; }
      if (Wild.ready()) return { id: 'wild', get: Hints.elm(UI.navBtn('forest')), line: Speech.line('tutExplore') };
      for (var j = 0; j < 6; j++) if (Game.plotState(j).empty) return { id: 'plot', get: Hints.wpt(W, F.plots[j].el._x, F.plots[j].el._y - 40), line: Speech.line('tutPlant') };
      if (S.appleTree.count > 0) return { id: 'apple', get: Hints.wpt(W, FARM_L.apples[0][0], FARM_L.apples[0][1]), line: 'Tap an apple!' };
      var af = DECOR.filter(function (d) { return !d.gift && S.level >= d.level && Game.canAfford(d.stars, d.items) && !Game.decorCount(d.id); })[0];
      if (af) return { id: 'decor', get: Hints.elm(UI.navBtn('decor')), line: 'So pretty!' };
      var p0 = S.ponies[0]; if (p0 && F.ponies[p0.id]) { var F0 = F.ponies[p0.id]; return { id: 'any', get: function () { return Hints.wpt(W, F0.x, F0.y - 110)(); }, line: Speech.line('tutTap') }; }
    }
    if (scr === 'forest') {
      var Fo = Scenes.forest, Wf = Fo.world, ws = Wild.status().s, c = S.wild.current;
      if (ws === 'trail') { var hf = Fo.hoofs[c.trail]; return { id: 'hoof', get: Hints.wpt(Wf, hf._x, hf._y - 30), line: Speech.line('follow') }; }
      if (ws === 'revealed' && S.inv[BREED[c.breed].fav] > 0) { var slot = Fo.bagSlot(BREED[c.breed].fav); return { id: 'feedwild', get: Hints.elm(slot), line: Speech.line('love', { food: FOOD_WORD[BREED[c.breed].fav] }) }; }
      var t = now(), f = S.forest;
      for (var k = 0; k < 3; k++) if (f.crystals[k] <= t) return { id: 'cr', get: Hints.wpt(Wf, FOREST_L.crystals[k][0], FOREST_L.crystals[k][1] - 50) };
      if (f.falls.count > 0) return { id: 'pool', get: Hints.wpt(Wf, FOREST_L.pool.x, FOREST_L.pool.y) };
      for (var b = 0; b < 2; b++) if (f.bushes[b].count > 0) return { id: 'berry', get: Hints.wpt(Wf, FOREST_L.bushes[b][0], FOREST_L.bushes[b][1] - 80) };
      var bug = Fo.bugs.filter(function (x) { return x.on; })[0];
      if (bug) return { id: 'bug', get: function () { return Hints.wpt(Wf, bug.x, bug.y)(); } };
      for (var m = 0; m < 5; m++) if (f.mushrooms[m] <= t) return { id: 'mush', get: Hints.wpt(Wf, FOREST_L.mush[m][0], FOREST_L.mush[m][1] - 60) };
      return { id: 'home', get: Hints.wpt(Wf, FOREST_L.farmBtn[0], FOREST_L.farmBtn[1] - 40) };
    }
    if (scr === 'care') {
      var p = Care.p; if (!p || Care.mode) return null;
      var sel = null;
      if (p.sleeping) sel = 'sleep';
      else if (Time.isNight() && p.stats.energy < 60) sel = 'sleep';
      else {
        var low = null, lv = 80;
        ['full', 'energy', 'clean', 'happy'].forEach(function (k) { if (p.stats[k] < lv) { lv = p.stats[k]; low = k; } });
        sel = low ? { full: 'eat', clean: 'wash', happy: 'play', energy: 'sleep' }[low] : null;
      }
      if (!sel) return null;
      return { id: 'care' + sel, get: Hints.elm($('#care .act[data-a="' + sel + '"]')) };
    }
    if (scr === 'pick') { var hb = $$('#pick .hbp')[1]; return hb ? { id: 'pick', get: Hints.elm(hb) } : null; }
    if (scr === 'name') { var ok = $('#name .ok'); return ok && !$('#name input') ? { id: 'nameok', get: Hints.elm(ok) } : null; }
    if (scr === 'decor') {
      if (Decor.ghost) return { id: 'ghost', get: Hints.elm(Decor.ghost.el) };
      var d = $('#drawer .dc:not(.locked)'); if (d && $('#drawer').classList.contains('on')) return { id: 'dc', get: Hints.elm(d) };
    }
    return null;
  }
};

/* ============================== TUTORIAL ============================= */
/* steps: 0 title,1 pick,2 name,3 tap pony,4 feed,5 brush,6 back,7 plant,8 apple,9 harvest,10 done */
var Tutorial = {
  handFixed: false,
  active: function () { return S && !S.tutorial.done && S.tutorial.step >= 3; },
  step: function () { return S ? S.tutorial.step : 0; },
  blocksPan: function () { var s = Tutorial.step(); return s === 3 || s === 7 || s === 8 || s === 9; },
  /* which hit ids are allowed in world scenes */
  allowHit: function (h) {
    if (!Tutorial.active()) return true;
    var s = Tutorial.step(), starter = S.ponies[0];
    if (s === 3) return h === 'pony:' + (starter && starter.id);
    if (s === 7) return h === 'plot0';
    if (s === 8) return h.indexOf('apple') === 0 || h === 'water0' || h === 'tree';
    if (s === 9) return h === 'plot0' || h.indexOf('apple') === 0 || h === 'water0' || h === 'tree';
    return false;
  },
  allow: function (elm) {
    if (!Tutorial.active()) return true;
    var s = Tutorial.step();
    /* title / pick / name screens are never gated (reload mid-tutorial must always be able to press play) */
    if (elm.closest('#title') || elm.closest('#pick') || elm.closest('#name') || elm.closest('#sheet') || elm.closest('#celebrate') || elm.closest('#dbg')) return true;
    if (s === 4) return !!elm.closest('#care .tools') || elm.dataset.a === 'eat';
    if (s === 5) return elm.dataset.a === 'brush';
    if (s === 6) return elm.dataset.b === 'back';
    if (s === 7) return !!elm.closest('.pop') && elm.dataset.c === 'carrot';
    if (s === 10) return elm.dataset && elm.dataset.tab === 'forest';
    return false;
  },
  blocked: function (elm) { sfx('tap'); Tutorial.show(true); },
  set: function (n) { S.tutorial.step = n; Save.dirty(); Tutorial.show(); },
  event: function (ev) {
    if (!S || S.tutorial.done) { Tutorial.tips(ev); return; }
    var s = S.tutorial.step;
    if (s === 2 && ev === 'named') Tutorial.set(3);
    else if (s === 3 && ev === 'tapPony') { Hand.hide(); Tutorial.spot(null); }
    else if (s === 3 && ev === 'careOpen') Tutorial.set(4);
    else if (s === 4 && ev === 'feed') Tutorial.set(5);
    else if (s === 5 && ev === 'brush') setTimeout(function () { Tutorial.set(6); }, 900);
    else if (s === 6 && ev === 'careBack') Tutorial.set(7);
    else if (s === 7 && ev === 'plant') Tutorial.set(8);
    else if (s === 8 && ev === 'apple') Tutorial.set(9);
    else if (s === 9 && ev === 'harvest') Tutorial.finish();
    else if (ev === 'plotOpen' && s === 7) setTimeout(Tutorial.show, 50);
    else if (ev === 'careOpen' && s >= 4 && s <= 6) Tutorial.show();
  },
  onScreen: function (name) { if (S && !S.tutorial.done) setTimeout(Tutorial.show, 400); },
  spot: function (r) {
    var sp = $('#spot');
    if (!r) { sp.classList.remove('on'); return; }
    sp.classList.add('on');
    sp.style.left = (r.x - r.r) + 'px'; sp.style.top = (r.y - r.r) + 'px'; sp.style.width = sp.style.height = (2 * r.r) + 'px';
  },
  show: function (again) {
    if (!S || S.tutorial.done) { Tutorial.spot(null); return; }
    var s = S.tutorial.step, F = Scenes.farm;
    if (s < 3) return;
    Hand.keep = true; Tutorial.handFixed = true;
    var say = function (k) { Speech.sayKey(k, null, { force: !!again || true }); };
    var spotEl = function (get, r) { var f = function () { var p = get(); if (p) Tutorial.spot({ x: p.x, y: p.y, r: r }); }; f(); clearInterval(Tutorial._si); Tutorial._si = setInterval(f, 120); };
    clearInterval(Tutorial._si); Tutorial.spot(null);
    if (UI.cur === 'farm' && F.built) {
      if (s === 3) {
        var Fp = F.ponies[S.ponies[0].id]; if (!Fp) return;
        if (!F.world.visible(Fp.x, 100)) F.world.panTo(Fp.x, 500);
        var g = function () { return F.world.toScreen(Fp.x, Fp.y - (Fp.p.stage === 'foal' ? 80 : 120)); };
        Hand.show(g, { pulse: true }); spotEl(g, 120); say('tutTap');
      } else if (s === 7) {
        F.world.panTo(1016, 700);
        var po = F.plots[0].el;
        if (Pop.el) { var sb = Pop.el.querySelector('[data-c="carrot"]'); Hand.show(Hints.elm(sb), { pulse: true }); }
        else { var g2 = function () { return F.world.toScreen(po._x, po._y - 45); }; Hand.show(g2, { pulse: true }); setTimeout(function () { spotEl(g2, 80); }, 720); say('tutPlant'); }
      } else if (s === 8) {
        F.world.panTo(960, 500);
        var can = F.plots[0].el.querySelector('.canIn');
        if (can && !again && !Tutorial._canShown) { Tutorial._canShown = true; Hand.show(Hints.elm(can), { pulse: true }); setTimeout(function () { if (S.tutorial.step === 8) Tutorial.show(true); }, 3000); return; }
        var a = F.apples.filter(function (x) { return x._on; })[0] || F.apples[0], g3 = function () { return FX.screenOf(a); };
        Hand.show(g3, { pulse: true }); spotEl(g3, 50); Speech.say('Tap an apple!', { force: true });
      } else if (s === 9) {
        var po2 = F.plots[0].el, g4 = function () { return F.world.toScreen(po2._x, po2._y - 45); };
        var st = Game.plotState(0);
        if (st.ripe) { Hand.show(g4, { pulse: true }); spotEl(g4, 80); say('tutPick'); }
        else { Hand.hide(); Tutorial.spot(null); Pop.timer(F.world, po2, st); clearTimeout(Tutorial._wt); Tutorial._wt = setTimeout(function () { Tutorial.show(); }, Math.min(st.left + 300, 3000)); }
      } else if (s === 10) {
        Hand.show(Hints.elm(UI.navBtn('forest')), { pulse: true }); say('tutExplore');
      } else if (s >= 4 && s <= 6) { /* returned to farm mid-care: reopen care */ Tutorial.set(7); }
    } else if (UI.cur === 'care') {
      var c = $('#care');
      if (s === 4) {
        if (Care.mode !== 'eat') { Care.openFood(c.querySelector('.act[data-a="eat"]')); }
        var food = function () { return Hints.elm(c.querySelector('.tools .food[data-f="carrot"]') || c.querySelector('.tools .food'))(); };
        Hand.show(null, { drag: { from: food, to: function () { return Care.view.mouthPt(); } } });
        say('tutFeed');
      } else if (s === 5) {
        if (Care.mode !== 'brush') Care.startBrush(c.querySelector('.act[data-a="brush"]'));
        var r = function () { var b = Care.view.jump.getBoundingClientRect(); return { x: b.left + b.width * 0.3, y: b.top + b.height * 0.62 }; };
        var r2 = function () { var b = Care.view.jump.getBoundingClientRect(); return { x: b.left + b.width * 0.7, y: b.top + b.height * 0.55 }; };
        Hand.show(null, { drag: { from: r, to: r2 } });
        say('tutBrush');
      } else if (s === 6) {
        var bk = c.querySelector('.back-btn'); Hand.show(Hints.elm(bk), { pulse: true }); spotEl(Hints.elm(bk), 48);
      }
    }
  },
  finish: function () {
    S.tutorial.done = true; S.tutorial.step = 10; Hand.keep = false; Tutorial.handFixed = false;
    Tutorial.spot(null); clearInterval(Tutorial._si);
    Game.addStars(20);
    for (var k = 0; k < 5; k++) FX.fly(ART.icon('star', 64), { x: innerWidth / 2, y: innerHeight / 2 }, $('#starPill .ic'), { size: 44, delay: k * 90 });
    Game.award('m_hello');
    S.wild.lastBefriendedAt = now();
    Wild.update();
    Save.write();
    setTimeout(function () {
      Hand.show(Hints.elm(UI.navBtn('forest')), { pulse: true, ms: 9000 });
      Speech.sayKey('tutExplore', null, { force: true, anchor: UI.navBtn('forest') });
      UI.badges();
    }, 2600);
  },
  tips: function (ev) {
    if (!S || !S.tutorial.done) return;
    var T2 = S.tutorial.tips, Fo = Scenes.forest;
    if (ev === 'forest') {
      Hand.keep = false;
      if (!T2.mushroom) { setTimeout(function () { Hand.show(Hints.wpt(Fo.world, FOREST_L.mush[0][0], FOREST_L.mush[0][1] - 60), { pulse: true, ms: 4000 }); }, 600); }
      else if (!T2.hoof && Wild.status().s === 'trail') Tutorial.tips('mushroom');
    }
    if (ev === 'mushroom' && !T2.hoof && Wild.status().s === 'trail') {
      T2.hoof = true;
      var c = S.wild.current; Hand.hide();
      setTimeout(function () { var hf = Fo.hoofs[c.trail]; Hand.show(Hints.wpt(Fo.world, hf._x, hf._y - 30), { pulse: true, ms: 5000 }); Speech.sayKey('follow', null, { force: true }); }, 700);
    }
  }
};
Bus.on('wild', function () {
  if (S.tutorial.done && !S.tutorial.tips.wildFeed && UI.cur === 'forest') { }
});

/* ============================== DEBUG ================================ */
var Debug = {
  init: function () {
    if (!DEBUG) return;
    var d = el('div', '', '<div class="p hidden"><pre></pre><div class="bs"></div></div><button class="t">🐞</button>'); d.id = 'dbg';
    $('#app').appendChild(d);
    var p = d.querySelector('.p'), bs = d.querySelector('.bs');
    d.querySelector('.t').addEventListener('click', function () { p.classList.toggle('hidden'); Debug.read(); });
    var B = {
      '+10 min': function () { Debug.skip(10 * T.MIN); }, '+1 h': function () { Debug.skip(T.HOUR); }, '+1 day': function () { Debug.skip(T.DAY); },
      '+100 ★': function () { Game.addStars(100); },
      '+5 items': function () { ITEM_KEYS.forEach(function (k) { Game.addItem(k, 5); }); },
      '+200 XP': function () { Game.addXP(200); },
      'Ready all': function () {
        var t = now();
        S.garden.forEach(function (g) { if (g.crop) g.readyAt = t; });
        S.appleTree.count = 3; S.forest.bushes.forEach(function (b) { b.count = 3; }); S.forest.falls.count = 3; S.forest.bugs.count = Time.isNight() ? 8 : 5;
        S.forest.mushrooms = [0, 0, 0, 0, 0]; S.forest.crystals = [0, 0, 0];
        if (S.wild.current) S.wild.current.awayUntil = 0;
        if (Wild.status().s === 'waitDelay') S.wild.lastBefriendedAt = t - T.DAY;
        Debug.rerender();
      },
      'Skip wild': function () {
        if (S.wild.index >= S.wild.queue.length) return;
        if (!S.wild.current) Wild.spawn();
        var p = Wild.befriend(); Scenes.forest.wildEls = null; Scenes.forest.wildKey = null;
        if (Scenes.farm.built) Scenes.farm.syncPonies();
        Debug.rerender();
      },
      'Reset save': function () { if (confirm('Reset save?')) { Main.resetting = true; Save.reset(); location.reload(); } }
    };
    Object.keys(B).forEach(function (k) { var b = el('button', '', k); b.addEventListener('click', function () { B[k](); Save.write(); Debug.read(); }); bs.appendChild(b); });
    setInterval(function () { if (!p.classList.contains('hidden')) Debug.read(); }, 1000);
  },
  read: function () {
    var st = Wild.status();
    $('#dbg pre').textContent = 'time: ' + new Date(now()).toLocaleString() + '\nplayDay: ' + Time.playDay() + '  L' + S.level + ' xp ' + S.xp + '\nwild #' + (S.wild.index + 1) + ' ' + st.s + (S.wild.current ? ' h' + S.wild.current.hearts + ' t' + S.wild.current.trail : '') + '\noffsetMs: ' + S.debug.offsetMs;
  },
  skip: function (ms) {
    var old = now();
    S.debug.offsetMs += ms;
    Game.catchUp(old, now());
    Debug.rerender();
  },
  rerender: function () {
    Game.regenAll();
    S.ponies.forEach(function (p) { Game.updateStage(p); });
    if (Scenes.farm.built) { Scenes.farm.syncPonies(); Scenes.farm.refresh(true); }
    if (Scenes.forest.built) { Scenes.forest.wildKey = null; Scenes.forest.refresh(true); Scenes.forest.bagRefresh(); }
    if (UI.cur === 'care') Care.refresh();
    if (UI.cur === 'ponies') Scenes.ponies.enter();
    UI.hudAll(); UI.badges();
  }
};

/* ============================== MAIN ================================= */
var Main = {
  boot: function () {
    S = Save.load();
    var fresh = !S;
    if (!S) S = freshSave();
    /* catch-up from timestamps */
    Main.welcome = !fresh && now() - S.lastTick > 3 * T.HOUR;
    Game.catchUp(S.lastTick, now());
    S.ponies.forEach(function (p) { Game.updateStage(p); });
    Own._w();
    var st = document.createElement('style'); st.textContent = ART.ponyCSS; document.head.appendChild(st);
    IC2._pony = '<img class="navpony" alt="" draggable="false" width="42" height="42" src="' + svgURL(svgPrep(PonyArt.portrait(PonyArt.breedPony('skybloom', 'grown')).replace('class="pony portrait"', 'class="pony portrait still"'), 0, pvImgCss())) + '">';
    Speech.init();
    UI.init();
    Hints.init();
    Debug.init();
    UI.hudAll();
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) { if (!e.target.closest('.page,.opts,.dlist,input')) e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('pointerdown', function () { Audio.unlock(); }, true);
    /* ticks & saves */
    setInterval(function () { Game.tick(); }, 1000);
    setInterval(Save.write, 10000);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) Save.write();
      else { if (now() - S.lastTick > 3 * T.HOUR && S.tutorial.done) { Main.welcome = true; if (UI.cur === 'farm') setTimeout(function () { Scenes.farm.welcome(); }, 600); } Game.catchUp(S.lastTick, now()); Debug.rerender(); if (Audio.ctx && Audio.ctx.state === 'suspended') Audio.ctx.resume(); }
    });
    window.addEventListener('pagehide', Save.write);
    Bus.on('items', function () { if (UI.cur === 'care' && Care.mode === 'eat') { } });
    UI.go('title');
    if (fresh) Save.write();
  },
  afterTitle: function () {
    var s = S.tutorial.step;
    if (!S.ponies.length) { UI.go('pick'); return; }
    if (!S.tutorial.done && s <= 2) { UI.go('name', { pony: S.ponies[0] }); return; }
    if (!S.tutorial.done && s >= 4 && s <= 6) { UI.go('care', S.ponies[0]); return; }
    UI.go('farm');
  },
  startNew: function (breed) {
    var q = ['sunrise', 'skybloom', 'cloverhop'].filter(function (k) { return k !== breed; });
    var common = shuffle(BREEDS.filter(function (b) { return b.tier === 'common'; }).map(function (b) { return b.key; }));
    var unc = shuffle(BREEDS.filter(function (b) { return b.tier === 'uncommon'; }).map(function (b) { return b.key; }));
    var rare = shuffle(BREEDS.filter(function (b) { return b.tier === 'rare'; }).map(function (b) { return b.key; }));
    var shim = shuffle(BREEDS.filter(function (b) { return b.tier === 'shimmer'; }).map(function (b) { return b.key; }));
    S.wild.queue = q.concat(common, unc, rare, shim);
    var p = Game.makePony(breed, true);
    S.tutorial.step = 2;
    Save.write();
    setTimeout(function () { UI.go('name', { pony: p }); }, 1100);
  }
};

window.addEventListener('error', function (e) { /* never show errors to the child */ });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Main.boot); else Main.boot();


</script>
