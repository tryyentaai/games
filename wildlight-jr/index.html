<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wildlight Jr">
<meta name="theme-color" content="#2fb7c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Wildlight Jr.</title>
<style>
:root{--u:4px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2fb7c9;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 2.2*var(--u)) calc(var(--sar) + 2.2*var(--u)) 0 calc(var(--sal) + 2.2*var(--u));
  display:flex;align-items:flex-start;justify-content:space-between;z-index:30;pointer-events:none}
.hud>*{pointer-events:auto}
.rbtn{width:max(64px,15*var(--u));height:max(64px,15*var(--u));border-radius:50%;background:#fff;box-shadow:0 calc(.8*var(--u)) 0 #0002,0 1.2vmin 3vmin #0003;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.rbtn:active{transform:scale(.9)}
.rbtn svg{width:58%;height:58%}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14);filter:drop-shadow(0 0 2vmin #fff8a8)}}
@keyframes bob{50%{transform:translateY(-4%)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.stk{filter:drop-shadow(0 1vmin 1.2vmin #0004)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
/* title */
#s-title .logo{position:absolute;left:0;right:0;top:calc(var(--sat) + 7*var(--u));text-align:center;font-size:calc(15*var(--u));font-weight:900;letter-spacing:.02em;
  color:#fff;-webkit-text-stroke:calc(.7*var(--u)) #1c5d8a;paint-order:stroke fill;text-shadow:0 calc(1*var(--u)) 0 #1c5d8a}
#s-title .logo small{display:block;font-size:.45em;color:#ffd84a}
#s-title .hero{position:absolute;left:50%;top:40%;width:min(62vw,46vh);transform:translate(-50%,-50%);animation:bob 1.6s ease-in-out infinite}
#s-title .hi{position:absolute;left:0;right:0;top:63%;text-align:center;font-size:calc(7*var(--u));-webkit-text-stroke:calc(.4*var(--u)) #1c5d8a;paint-order:stroke fill}
.play{position:absolute;left:50%;bottom:calc(var(--sab) + 9vh);transform:translateX(-50%);width:max(110px,30*var(--u));height:max(110px,30*var(--u));border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8ff07a,#2fae3a);box-shadow:0 1.4vmin 0 #1d7a27,0 2vmin 5vmin #0005;display:flex;align-items:center;justify-content:center}
.play svg{width:46%;height:46%;margin-left:8%}
.play:active{transform:translateX(-50%) scale(.92)}
#btn-play.pulse{animation:none;box-shadow:0 1.4vmin 0 #1d7a27,0 0 0 2vmin #fff8,0 2vmin 5vmin #0005}
.gear{position:absolute;right:calc(var(--sar) + 2.5*var(--u));top:calc(var(--sat) + 2.5*var(--u));width:max(48px,11*var(--u));height:max(48px,11*var(--u));opacity:.75;z-index:40}
.gear svg{width:100%;height:100%}
.gear .ring{position:absolute;inset:-12%;border-radius:50%;border:calc(.9*var(--u)) solid #fff;clip-path:inset(0 0 0 0);opacity:0}
.gear.hold .ring{opacity:1;animation:spin 2s linear}
@media (orientation:landscape) and (max-height:700px){
  #s-title .hero{left:36%;top:58%;width:min(34vw,52vh)}
  #s-title .play{left:72%;bottom:auto;top:52%;transform:translate(-50%,-50%)}
  #s-title .play:active{transform:translate(-50%,-50%) scale(.92)}
  #s-title .logo{font-size:calc(13*var(--u))}
}
/* map */
#s-map .sky{position:absolute;inset:0;background:linear-gradient(#8fdcff,#c8f1ff 45%,#9be27a 45.1%,#62c254)}
#s-map svg.path{position:absolute;inset:0;width:100%;height:100%}
.place{position:absolute;border-radius:50%;background-size:cover;background-position:center;border:calc(1.2*var(--u)) solid #fff;box-shadow:0 1.2vmin 0 #0003;transform:translate(-50%,-50%)}
.place.locked{filter:grayscale(1) brightness(.75)}
.place .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%}
.place .lock svg{width:38%}
.place .need{display:flex;flex-wrap:wrap;justify-content:center;gap:3%;width:80%}
.place .need i{width:13%;aspect-ratio:1;border-radius:50%;background:#fff;opacity:.9}
.place.new{animation:pulse .9s ease-in-out infinite}
.place .tag{position:absolute;left:50%;bottom:-18%;transform:translateX(-50%);white-space:nowrap;font-size:calc(4.2*var(--u));-webkit-text-stroke:calc(.35*var(--u)) #1c5d8a;paint-order:stroke fill}
.bookbtn{position:absolute;left:calc(var(--sal) + 3*var(--u));bottom:calc(var(--sab) + 3*var(--u));width:max(80px,20*var(--u));height:max(80px,20*var(--u));border-radius:28%;
  background:#ff8a3d;box-shadow:0 1.2vmin 0 #b9561c;display:flex;align-items:center;justify-content:center;z-index:20}
.bookbtn svg{width:64%}
.bookbtn b{position:absolute;right:-12%;top:-12%;min-width:46%;padding:0 6%;height:46%;border-radius:999px;background:#fff;color:#ff6a1a;font-size:calc(5*var(--u));display:flex;align-items:center;justify-content:center}
.mapbuddy{position:absolute;right:calc(var(--sar) + 2*var(--u));bottom:calc(var(--sab) + 1*var(--u));width:min(30vw,22vh);z-index:20}
/* explore */
.slots{display:flex;gap:calc(1.6*var(--u));background:#fff8;padding:calc(1.2*var(--u));border-radius:999px}
.slot{width:max(48px,12*var(--u));height:max(48px,12*var(--u));border-radius:50%;background:#fff6;border:calc(.6*var(--u)) dashed #fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slot.full{background:#fff;border-style:solid;border-color:#ffd84a;animation:pop .5s}
.slot img{width:92%}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.patch{position:absolute;transform:translate(-50%,-70%);transform-origin:50% 100%}
.patch>div{width:100%;height:100%;transform-origin:50% 100%}
.patch.wig>div{animation:wig .5s ease-in-out 2}
.patch.hot>div{animation:wig .45s ease-in-out infinite}
.patch.gone{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-70%) scale(.4)}
.patch svg{width:100%;height:100%;overflow:visible}
.buddy{position:absolute;transform:translate(-50%,-90%);transition:left .55s cubic-bezier(.3,1.4,.6,1),top .55s cubic-bezier(.3,1.4,.6,1);z-index:10}
.buddy img{width:100%;animation:bob 1.2s ease-in-out infinite}
.hand{position:absolute;font-size:calc(14*var(--u));z-index:60;pointer-events:none;transform:translate(-30%,0);animation:tapme 1.1s ease-in-out infinite;filter:drop-shadow(0 .6vmin .6vmin #0006)}
@keyframes tapme{0%,100%{transform:translate(-30%,30%)}50%{transform:translate(-30%,0) scale(.9)}}
/* meet */
#s-meet .dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff3,#0004 70%)}
.hearts{display:flex;gap:calc(1.5*var(--u));background:#fff8;padding:calc(1.2*var(--u)) calc(2*var(--u));border-radius:999px}
.hearts i{width:max(40px,10*var(--u));height:max(40px,10*var(--u));display:block}
.hearts i svg{width:100%;height:100%}
.hearts i.on{animation:pop .5s}
.stage{position:absolute;inset:0}
.mon{position:absolute;transform:translate(-50%,-50%)}
.mon.gold{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.12) drop-shadow(0 0 2vmin #ffe36a)}
.spot{position:absolute;transform:translate(-50%,-100%)}
.spot .peek{position:absolute;left:50%;bottom:20%;width:86%;transform:translate(-50%,60%);transition:transform .22s cubic-bezier(.3,1.5,.6,1)}
.spot.up .peek{transform:translate(-50%,0)}
.spot.glow .peek{filter:drop-shadow(0 0 2.5vmin #fff59a) drop-shadow(0 0 1vmin #fff)}
.spot .front{position:absolute;left:0;right:0;bottom:0;height:62%}
.spot .front svg{width:100%;height:100%;overflow:visible}
.bubble{position:absolute;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 0 #0002}
.bubble::after{content:"";position:absolute;left:8%;bottom:-6%;width:22%;height:22%;border-radius:50%;background:#fff}
.bubble span{line-height:1}
.bubble.sil span{filter:brightness(0) opacity(.75)}
.snacks{position:absolute;left:0;right:0;display:flex;justify-content:center}
.snack{border-radius:30%;background:#fff;box-shadow:0 1.2vmin 0 #0003;display:flex;align-items:center;justify-content:center;line-height:1;transition:opacity .3s,transform .15s}
.snack:active{transform:scale(.92)}
.snack.off{opacity:.25;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:calc(2*var(--u)) solid #fff;box-shadow:0 0 2vmin #fff8;transform:translate(-50%,-50%)}
.ring.in{border-color:#ffe14d;box-shadow:0 0 4vmin #ffe14d}
.target{position:absolute;border-radius:50%;border:calc(.8*var(--u)) dashed #fff9;transform:translate(-50%,-50%)}
.orb{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#ffe9a0 25%,#ff9d2e 60%,#e25a1c);box-shadow:0 0 5vmin #ffd25a,0 1.2vmin 0 #a8401466}
.orb::after{content:"";position:absolute;left:0;right:0;top:46%;height:8%;background:#7a2c0c55}
/* party */
#s-party .row{position:absolute;left:0;right:0;top:30%;display:flex;justify-content:center;align-items:flex-end;gap:1vw}
#s-party .row img{width:min(22vw,24vh)}
#s-party .row img:nth-child(odd){animation:bob .7s ease-in-out infinite}
#s-party .row img:nth-child(even){animation:bob .7s ease-in-out infinite .35s}
.choices{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 8vh);display:flex;justify-content:center;gap:10vw;opacity:0;transition:opacity .4s;pointer-events:none}
.choices.on{opacity:1;pointer-events:auto}
.choices .play{position:static;transform:none}
.choices .play:active{transform:scale(.92)}
.mapbig{width:max(110px,30*var(--u));height:max(110px,30*var(--u));border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd36b,#ff9a2a);box-shadow:0 1.4vmin 0 #b9561c;display:flex;align-items:center;justify-content:center}
.mapbig svg{width:56%}
#s-party .name{position:absolute;left:0;right:0;top:calc(var(--sat) + 6vh);text-align:center;font-size:calc(9*var(--u));-webkit-text-stroke:calc(.5*var(--u)) #1c5d8a;paint-order:stroke fill}
/* book */
#s-book{background:linear-gradient(#ffcf8a,#ffb070)}
.grid{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 22*var(--u));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(max(96px,22*var(--u)),1fr));gap:calc(2*var(--u));padding:calc(2*var(--u)) calc(var(--sar) + 3*var(--u)) calc(var(--sab) + 6*var(--u)) calc(var(--sal) + 3*var(--u))}
.card{aspect-ratio:1/1.12;background:#fff;border-radius:16%;box-shadow:0 1vmin 0 #c96f2a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6%}
.card img{width:88%;aspect-ratio:1;object-fit:contain}
.card.unk img{filter:brightness(0) opacity(.18)}
.card .st{height:16%;display:flex;gap:2%;justify-content:center}
.card .st svg{height:100%}
.card.gold{background:linear-gradient(135deg,#fff7c2,#ffd84a)}
.count{display:flex;align-items:center;gap:calc(1.5*var(--u));background:#fff;color:#ff6a1a;border-radius:999px;padding:calc(.8*var(--u)) calc(3*var(--u));font-size:calc(7*var(--u));font-weight:900}
.zoom{position:fixed;inset:0;background:#0009;z-index:70;display:none;align-items:center;justify-content:center}
.zoom.on{display:flex}
.zoom .box{width:min(84vw,70vh);aspect-ratio:1;background:#fff;border-radius:12%;position:relative;display:flex;align-items:center;justify-content:center;animation:pop .4s}
.zoom .box img{width:86%}
.zoom .zx{position:absolute;right:-5%;top:-5%;width:max(64px,16*var(--u));height:max(64px,16*var(--u));border-radius:50%;background:#ff6a5a;box-shadow:0 1vmin 0 #0003;display:flex;align-items:center;justify-content:center}
.zoom .zx svg{width:55%}
.zoom .where{position:absolute;right:-6%;bottom:-6%;width:34%;aspect-ratio:1;border-radius:50%;border:calc(1*var(--u)) solid #fff;background-size:cover;background-position:center;box-shadow:0 1vmin 0 #0003}
/* grown-ups */
#grown{position:fixed;inset:0;z-index:100;background:#0b2233ee;display:none;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-y:auto;touch-action:pan-y;
  padding:calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 30px) calc(var(--sal) + 20px)}
#grown.on{display:block}
#grown h2{font-size:24px;margin-bottom:6px}
#grown p.sub{opacity:.7;margin-bottom:18px;font-size:15px}
#grown .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ffffff22;font-size:18px}
#grown .seg{display:flex;gap:6px;flex-wrap:wrap}
#grown .seg button{min-width:64px;min-height:48px;padding:0 12px;border-radius:12px;background:#ffffff1c;font-size:16px}
#grown .seg button.on{background:#2fb7c9;color:#04222a;font-weight:700}
#grown input{font-size:18px;padding:10px 12px;border-radius:10px;border:0;width:170px;-webkit-user-select:text;user-select:text}
#grown .done{margin-top:24px;width:100%;min-height:56px;border-radius:14px;background:#2fb7c9;color:#04222a;font-size:20px;font-weight:700}
#grown .reset{margin-top:12px;width:100%;min-height:48px;border-radius:14px;background:#ffffff14;font-size:16px;position:relative;overflow:hidden}
#grown .reset i{position:absolute;left:0;top:0;bottom:0;width:0;background:#e2545455}
#grown .reset.hold i{width:100%;transition:width 3s linear}
#grown .stats{margin-top:16px;opacity:.65;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="s-title" class="scr">
  <div class="bg"></div>
  <div class="logo">Wildlight<small>Jr.</small></div>
  <img class="hero stk" alt="">
  <div class="hi"></div>
  <button class="play" id="btn-play" aria-label="Play"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#fff"/></svg></button>
  <button class="gear" aria-label="Grown-ups"><span class="ring"></span><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.9a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1L11 21h4l.4-2.9c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
</section>

<section id="s-map" class="scr">
  <div class="sky"></div>
  <svg class="path"></svg>
  <div class="places"></div>
  <button class="bookbtn" aria-label="Sticker book"><svg viewBox="0 0 24 24"><path fill="#fff" d="M4 4.5C4 3.7 4.7 3 5.5 3H19v15H6a2 2 0 0 0 0 4h13v-2H6"/><path fill="#ff8a3d" d="M11.5 6.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></svg><b>0</b></button>
  <img class="mapbuddy stk" alt="">
  <button class="rbtn help maphelp" aria-label="Help" style="position:absolute;left:calc(var(--sal) + 2.5*var(--u));top:calc(var(--sat) + 2.5*var(--u));z-index:20"></button>
  <button class="gear" aria-label="Grown-ups"><span class="ring"></span><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.9a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1L11 21h4l.4-2.9c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
</section>

<section id="s-explore" class="scr">
  <div class="bg"></div>
  <div class="field"></div>
  <div class="buddy"><img class="stk" alt=""></div>
  <div class="hud">
    <button class="rbtn home" aria-label="Map"></button>
    <div class="slots"></div>
    <button class="rbtn help" aria-label="Help"></button>
  </div>
</section>

<section id="s-meet" class="scr">
  <div class="bg"></div><div class="dim"></div>
  <div class="stage"></div>
  <div class="hud">
    <button class="rbtn home" aria-label="Back"></button>
    <div class="hearts"></div>
    <button class="rbtn help" aria-label="Help"></button>
  </div>
</section>

<section id="s-party" class="scr">
  <div class="bg"></div><div class="dim" style="position:absolute;inset:0;background:#0003"></div>
  <div class="name"></div>
  <div class="row"></div>
  <div class="choices">
    <button class="mapbig" id="btn-tomap" aria-label="Map"></button>
    <button class="play" id="btn-again" aria-label="Again"><svg viewBox="0 0 24 24" style="margin:0;width:56%;height:56%"><path fill="#fff" d="M12 4V1L7 5.5 12 10V7a5 5 0 1 1-5 5H4a8 8 0 1 0 8-8z"/></svg></button>
  </div>
</section>

<section id="s-book" class="scr">
  <div class="hud">
    <button class="rbtn home" aria-label="Back"></button>
    <div class="count"></div>
    <button class="rbtn help" aria-label="Help"></button>
  </div>
  <div class="grid"></div>
</section>
<div class="zoom"><div class="box"><img alt=""><div class="where"></div><button class="zx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></button></div></div>

<div id="grown" role="dialog" aria-label="Grown-ups">
  <h2>Grown-ups</h2>
  <p class="sub">Settings for parents. Your child can play without reading anything.</p>
  <div class="row"><span>Sound effects</span><div class="seg" data-k="sound"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
  <div class="row"><span>Music</span><div class="seg" data-k="music"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
  <div class="row"><span>Voice</span><div class="seg" data-k="voice"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
  <div class="row"><span>Help level</span><div class="seg" data-k="assist"><button data-v="more">More</button><button data-v="normal">Auto</button><button data-v="less">Less</button></div></div>
  <div class="row"><span>Child's name</span><input id="kidname" maxlength="14" placeholder="Shown on title" autocomplete="off"></div>
  <div class="row"><span>Rest reminder</span><div class="seg" data-k="remind"><button data-v="0">Off</button><button data-v="3">3 walks</button><button data-v="5">5 walks</button></div></div>
  <button class="done">Done</button>
  <button class="reset"><i></i><span>Hold 3 seconds to erase progress</span></button>
  <div class="stats"></div>
</div>

<script>
(() => {
'use strict';
const SLUG = 'wildlight-jr', KEY = SLUG + '.save.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- data ---------------- */
// [id, place, base(evolves from), favorite snack, cry:[hz, kind]]
const MON_LIST = [

/* ---------- explore ---------- */
function startWalk(place) {
  G.place = place;
  G.walk = { place, found: [], stars: 0, patches: [], taps: 0 };
  makePatches();
  goExplore(true);
}
function makePatches() {
  const n = 5, out = [];
  // spread over 5 lanes, avoid HUD (top) and buddy (bottom)
  const lanes = shuffle([0, 1, 2, 3, 4]);
  for (let i = 0; i < n; i++) {
    const portrait = H >= W;
    const col = i % (portrait ? 2 : 3), row = Math.floor(i / (portrait ? 2 : 3));
    let fx_, fy_;
    if (portrait) { fx_ = [.28, .72][col] + rnd(-.06, .06); fy_ = [.36, .54, .7][row] + rnd(-.03, .03); if (i === 4) fx_ = .5 + rnd(-.08, .08); }
    else { fx_ = [.2, .5, .8][col] + rnd(-.05, .05); fy_ = [.42, .66][row] + rnd(-.03, .03); if (i >= 3) fx_ = [.33, .67][i - 3] + rnd(-.05, .05); }
    out.push({ fx: fx_, fy: fy_, done: false, el: null, lane: lanes[i] });
  }
  G.walk.patches = out;
}
function goExplore(first) {
  show('explore');
  A.music(G.place);
  $('.bg', SCR.explore).style.backgroundImage = `url(${bgUrl(G.place)})`;
  $('.home', SCR.explore).innerHTML = ICON.map; $('.help', SCR.explore).innerHTML = ICON.help;
  $('.buddy img', SCR.explore).src = art('voltkit');
  const field = $('.field', SCR.explore); field.innerHTML = '';
  G.walk.patches.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'patch' + (p.done ? ' gone' : '');
    d.innerHTML = '<div>' + patchSvg(PL[G.place].patch) + '</div>';
    d.addEventListener('pointerdown', e => { e.preventDefault(); A.unlock(); tapPatch(i); });
    p.el = d; field.appendChild(d);
  });
  renderSlots();
  layoutExplore();
  // patches take turns wiggling
  const wiggle = () => { const live = G.walk.patches.filter(p => !p.done); if (live.length) { const p = pick(live); p.el.classList.remove('wig'); void p.el.offsetWidth; p.el.classList.add('wig'); } T.set(wiggle, 1400); };
  T.set(wiggle, 600);
  if (!S.tut.explore) {
    T.set(() => { const p = G.walk.patches.find(p => !p.done); if (p) { p.el.classList.add('hot'); const r = p.el.getBoundingClientRect(); showHand(r.left + r.width * .55, r.top + r.height * .55); } }, 600);
    T.set(() => A.say('explore', false), first ? 2600 : 200);
  } else if (first) { A.say(S.walks < 3 ? ['p_' + G.place, 'explore'] : ['p_' + G.place]); }
  G.hint = {
    pulse() { const p = G.walk.patches.find(p => !p.done); if (p) p.el.classList.add('hot'); },
    nudge() { A.say('nudge_tap'); },
    show() { const p = G.walk.patches.find(p => !p.done); if (p) { const r = p.el.getBoundingClientRect(); showHand(r.left + r.width * .55, r.top + r.height * .55); } },
  };
}
function layoutExplore() {
  const sz = clamp(Math.min(W * .3, H * .2), 90, 240);
  G.walk.patches.forEach(p => { if (!p.el) return; p.el.style.left = p.fx * W + 'px'; p.el.style.top = p.fy * H + 'px'; p.el.style.width = sz + 'px'; p.el.style.height = sz * .8 + 'px'; });
  const b = $('.buddy', SCR.explore), bs = clamp(Math.min(W * .3, H * .2), 90, 220);
  b.style.width = bs + 'px';
  const bf = G.walk.bf || [.5, null];
  b.style.left = bf[0] * W + 'px'; b.style.top = (bf[1] === null ? H * .97 - 26 : bf[1] * H) + 'px';
}
$('.buddy', SCR.explore).addEventListener('pointerdown', e => { e.preventDefault(); if (!G.busy) petBuddy($('.buddy img', SCR.explore)); });
function renderSlots() {
  const s = $('.slots', SCR.explore); s.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const f = G.walk.found[i], d = document.createElement('div');
    d.className = 'slot' + (f ? ' full' : '');
    if (f) d.innerHTML = `<img src="${art(f.id)}" class="${f.gold ? 'mon gold' : ''}" style="${f.gold ? 'position:static;transform:none' : ''}">`;
    s.appendChild(d);
  }
}
$('.home', SCR.explore).addEventListener('pointerdown', e => { e.preventDefault(); input(); A.sfx('tap'); if (G.walk && G.walk.found.length >= 3) goParty(); else if (!G.busy) goMap(); });
$('.help', SCR.explore).addEventListener('pointerdown', e => { e.preventDefault(); input(); helpNow(); });
function tapPatch(i) {
  if (G.busy || G.screen !== 'explore') return;
  const p = G.walk.patches[i]; if (!p || p.done) return;
  input(); G.busy = true; hideHand(); G.stats.taps++;
  if (!S.tut.explore) { S.tut.explore = true; save(); }
  G.walk.patches.forEach(q => q.el && q.el.classList.remove('hot'));
  p.done = true; G.walk.taps++;
  const b = $('.buddy', SCR.explore);
  G.walk.bf = [p.fx + (p.fx > .5 ? -1 : 1) * Math.min(.14, 120 / W), p.fy + .08];
  b.style.left = G.walk.bf[0] * W + 'px'; b.style.top = G.walk.bf[1] * H + 'px';
  A.sfx('hop');
  T.set(() => { A.sfx('rustle'); p.el.classList.remove('wig'); p.el.classList.add('hot'); }, 350);
  T.set(() => reveal(p), 1000);
}
function reveal(p) {
  p.el.classList.remove('hot'); p.el.classList.add('gone');
  const r = p.el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const need = 3 - G.walk.found.length, left = G.walk.patches.filter(q => !q.done).length;
  const canStar = G.walk.stars < 1 && left >= need && S.walks + G.walk.taps > 1 && Math.random() < .25;
  if (canStar) {
    G.walk.stars++; S.stars++; save();
    const st = document.createElement('div'); st.innerHTML = ICON.star('#ffd84a');
    st.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:${18 * U}px;transform:translate(-50%,-50%);z-index:20`;
    SCR.explore.appendChild(st);
    A.sfx('sparkle'); fx.burst(cx, cy, 30, 'gold'); A.say('star_find');
    anim(st, [{ transform: 'translate(-50%,-50%) scale(.2)' }, { transform: 'translate(-50%,-120%) scale(1.3) rotate(20deg)' }, { transform: 'translate(-50%,-160%) scale(0)' }], { duration: 1500, fill: 'forwards' });
    T.set(() => { st.remove(); G.busy = false; refillIfNeeded(); }, 1500);
    return;
  }
  startMeet(pickMon(), cx, cy);
}
function refillIfNeeded() {
  const need = 3 - G.walk.found.length;
  if (need > 0 && G.walk.patches.filter(q => !q.done).length < need) { makePatches(); goExplore(false); A.sfx('sparkle'); }
}
function pickMon() {
  const place = G.place, have = G.walk.found.map(f => f.id);
  if (place === 'cave' && !HOLD.includes('auroryx') && !isFriend('auroryx') && G.walk.found.length === 2) return 'auroryx';
  let pool = MON_LIST.filter(m => (m[1] === place || PL[place].extra.includes(m[0])) && m[0] !== 'auroryx' && (!m[2] || isFriend(m[2]))).map(m => m[0]).filter(id => !have.includes(id));
  if (place === 'cave' && !HOLD.includes('auroryx') && isFriend('auroryx') && Math.random() < .25 && !have.includes('auroryx')) return 'auroryx';
  if (!pool.length) pool = MON_LIST.filter(m => m[1] === place).map(m => m[0]);
  const w = pool.map(id => isFriend(id) ? 1 : 4);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}

/* ---------- meet (befriend) ---------- */
function effDiff() { let d = S.diff; if (S.set.assist === 'more') d = Math.min(d, 1); if (S.set.assist === 'less') d = Math.min(4, d + 1); return d; }
const assistMul = () => S.set.assist === 'more' ? 1.3 : S.set.assist === 'less' ? .85 : 1;
function startMeet(id, sx, sy, forceGame) {
  show('meet');
  const isNew = !isFriend(id);
  const gold = id !== 'voltkit' && friendCount() >= 3 && Math.random() < 1 / 12;
  const game = forceGame || (id === 'auroryx' ? 'ring' : GAMES[S.enc % 3]);
  S.enc++; save();
  G.enc = { id, gold, isNew, game, hearts: 0, misses: 0, streak: 0, t0: performance.now(), phase: 'intro', g: {} };
  $('.bg', SCR.meet).style.backgroundImage = `url(${bgUrl(G.place)})`;
  $('.help', SCR.meet).innerHTML = ICON.help;
  renderHearts();
  const st = $('.stage', SCR.meet); st.innerHTML = '';
  const m = document.createElement('img'); m.className = 'mon stk' + (gold ? ' gold' : ''); m.src = art(id); m.id = 'bigmon';
  st.appendChild(m);
  layoutMeet();
  anim(m, [{ transform: `translate(-50%,-50%) scale(.1)`, opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.15)', opacity: 1, offset: .7 }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 600, easing: 'ease-out' });
  A.sfx('pop'); A.cry(id);
  if (gold) { T.set(() => { fx.burst(W / 2, H * .42, 40, 'gold'); A.sfx('sparkle'); }, 300); }
  const lines = id === 'auroryx' && isNew ? ['legend', 'n_auroryx'] : gold ? ['golden', 'n_' + id] : [isNew ? 'found_new' : 'found_old', 'n_' + id];
  A.say(lines).then(() => { if (G.enc && G.enc.id === id && G.enc.phase === 'intro') beginGame(); });
  T.set(() => { if (G.enc && G.enc.phase === 'intro') beginGame(); }, 4200); // safety if audio stalls
  m.style.pointerEvents = 'auto';
  m.addEventListener('pointerdown', e => { e.preventDefault(); if (G.enc && G.enc.phase === 'intro') { A.cry(id); } });
}
function monSize() { return clamp(Math.min(W * .62, H * .4), 140, 460); }
function layoutMeet() {
  const e = G.enc; if (!e) return;
  const m = $('#bigmon'); const s = monSize();
  if (m) { m.style.width = s + 'px'; m.style.left = W / 2 + 'px'; m.style.top = H * (e.game === 'snack' && e.phase === 'play' ? .4 : .46) + 'px'; }
  if (e.phase === 'play' && GAME[e.game].layout) GAME[e.game].layout();
  if (e.phase === 'orb') layoutOrb();
}
function renderHearts() {
  const h = $('.hearts', SCR.meet); h.innerHTML = '';
  for (let i = 0; i < 3; i++) { const d = document.createElement('i'); d.innerHTML = i < (G.enc ? G.enc.hearts : 0) ? ICON.heartOn : ICON.heartOff; if (i < G.enc.hearts) d.className = 'on'; h.appendChild(d); }
}
function beginGame() {
  const e = G.enc; if (!e || e.phase !== 'intro') return;
  if (document.hidden) { T.set(beginGame, 500); return; }
  e.phase = 'play'; e.t0 = performance.now();
  A.say('g_' + e.game);
  GAME[e.game].start();
  layoutMeet();
  if (!S.tut[e.game]) T.set(() => { if (!S.tut[e.game] && GAME[e.game].demo && G.enc === e && e.phase === 'play' && e.hearts === 0) GAME[e.game].demo(); }, 900);
  G.hint = { pulse() { GAME[e.game].pulse && GAME[e.game].pulse(); }, nudge() { A.say('g_' + e.game + '_hint'); }, show() { e.streak = Math.max(e.streak, 2); GAME[e.game].assist && GAME[e.game].assist(); } };
}
// result of one attempt
function hit(x, y) {
  const e = G.enc; if (!e || e.phase !== 'play') return;
  e.hearts++; e.streak = 0; G.stats.hits++;
  if (!S.tut[e.game]) { S.tut[e.game] = true; save(); }
  hideHand();
  A.sfx('heart'); fx.burst(x, y, 22);
  renderHearts();
  if (e.hearts >= 3) { e.phase = 'won'; T.set(endGame, 650); }
  else if (e.hearts === 2) A.say('praise' + (1 + Math.floor(Math.random() * 6)));
}
function miss(line) {
  const e = G.enc; if (!e || e.phase !== 'play') return;
  e.misses++; e.streak++; G.stats.misses++;
  G.stats.maxStreak = Math.max(G.stats.maxStreak, e.streak);
  A.sfx('boop');
  if (line) A.say(line);
  if (e.streak >= 2 && GAME[e.game].assist) GAME[e.game].assist();
}
function endGame() {
  const e = G.enc; if (!e) return;
  G.stats.games++;
  GAME[e.game].stop && GAME[e.game].stop();

  const where = $('.where', zoom), place = MONS[id].place;
  where.style.display = place && !f ? '' : 'none'; if (place) where.style.backgroundImage = `url(${bgUrl(place)})`;
  if (f) { A.cry(id); A.say('n_' + id); anim(img, [{ transform: 'scale(1)' }, { transform: 'scale(1.08) translateY(-4%)' }, { transform: 'scale(1)' }], 500); }
  else { A.sfx('boop'); A.say('book_unknown'); }
}
zoom.addEventListener('pointerdown', e => { if (e.target === zoom || e.target.closest('.zx')) { zoom.classList.remove('on'); A.sfx('tap'); } else { const id = $('img', zoom).src.split('/').pop().replace('.webp', ''); if (S.friends[id]) { A.cry(id); A.say('n_' + id); } } });
document.addEventListener('pointerdown', e => { if (zoom.classList.contains('on') && e.target === zoom) zoom.classList.remove('on'); }, true);

/* ---------- grown-ups ---------- */
const grown = $('#grown');
$$('.gear').forEach(g => {
  let t = null;
  const start = e => { e.preventDefault(); g.classList.add('hold'); t = setTimeout(() => { g.classList.remove('hold'); openGrown(); }, 2000); };
  const end = () => { g.classList.remove('hold'); clearTimeout(t); };
  g.addEventListener('pointerdown', start); g.addEventListener('pointerup', end); g.addEventListener('pointerleave', end); g.addEventListener('pointercancel', end);
});
function openGrown() {
  grown.classList.add('on'); A.stopVoice();
  $$('.seg', grown).forEach(s => { const k = s.dataset.k, v = S.set[k]; $$('button', s).forEach(b => b.classList.toggle('on', String(typeof v === 'boolean' ? (v ? 1 : 0) : v) === b.dataset.v)); });
  $('#kidname').value = S.set.name;
  $('.stats', grown).innerHTML = `Friends made: ${friendCount() + 1} of ${MON_LIST.length} · Walks: ${S.walks} · Stars: ${S.stars}<br>Skill level: ${S.diff + 1} of 5 (adjusts automatically)<br>Voices pre-recorded on-device · works offline after first launch`;
}
$$('.seg', grown).forEach(s => $$('button', s).forEach(b => b.addEventListener('click', () => {
  const k = s.dataset.k, v = b.dataset.v;
  S.set[k] = (k === 'sound' || k === 'music' || k === 'voice') ? v === '1' : (k === 'remind' ? +v : v);
  save(); openGrown();
  if (k === 'music') A.music(S.set.music ? (G.screen === 'title' ? null : G.place) : null);
})));
$('#kidname').addEventListener('input', e => { S.set.name = e.target.value.replace(/[<>]/g, '').slice(0, 14); save(); });
$('.done', grown).addEventListener('click', () => { grown.classList.remove('on'); if (G.screen === 'title') goTitle(); });
(() => {
  const r = $('.reset', grown); let t = null;
  r.addEventListener('pointerdown', () => { r.classList.add('hold'); t = setTimeout(() => { r.classList.remove('hold'); const keep = S.set; S = clone(DEF); S.set = keep; save(); grown.classList.remove('on'); goTitle(); }, 3000); });
  const end = () => { r.classList.remove('hold'); clearTimeout(t); };
  r.addEventListener('pointerup', end); r.addEventListener('pointerleave', end); r.addEventListener('pointercancel', end);
})();
grown.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- main loop: fx, game tick, hint ladder, perf ---------- */
let lastF = performance.now(), slowAcc = 0, hintAcc = 0;
function loop(now) {
  const dt = now - lastF; lastF = now;
  try {
    if (G.tick) G.tick();
    fx.step();
    hintAcc += dt;
    if (hintAcc > 500) {
      hintAcc = 0;
      const idle = (now - G.lastInput) / G.spd;
      if (G.hint && !grown.classList.contains('on') && !zoom.classList.contains('on') && !G.busy) {
        if (idle > 5000 && G.hintStage < 1) { G.hintStage = 1; G.hint.pulse && G.hint.pulse(); }
        else if (idle > 10000 && G.hintStage < 2) { G.hintStage = 2; G.hint.nudge && G.hint.nudge(); }
        else if (idle > 20000 && G.hintStage < 3) { G.hintStage = 3; G.hint.show && G.hint.show(); G.hint.nudge && G.hint.nudge(); }
        else if (idle > 40000 && G.hintStage < 4) { G.hintStage = 4; }
      }
    }
    // auto-lower confetti resolution if frames run slow
    if (fx.ps.length) { slowAcc = slowAcc * .95 + (dt > 26 ? 1 : 0); if (slowAcc > 8 && fx.dpr > 1) { fx.dpr = 1; fx.resize(); slowAcc = 0; } }
  } catch (e) { recover(e); }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
['pointerdown', 'pointerup', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, () => A.unlock(), { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden) { A.stopVoice(); if (A.ctx) A.ctx.suspend().catch(() => { }); } else if (A.ctx) A.ctx.resume().catch(() => { }); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('error', e => { console.error(e.message); if (!G._rec) { G._rec = 1; recover(e); setTimeout(() => G._rec = 0, 1000); } });
resize();
// preload art
[...PLACES.map(p => bgUrl(p.id)), ...MON_LIST.map(m => art(m[0]))].forEach(u => { const i = new Image(); i.src = u; });
goTitle();
requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });

/* ---------- debug/test handle ---------- */
window.WJ = { G, get S() { return S; }, set S(v) { S = v; }, MONS, PLACES, A, api: {
  startWalk, startMeet, goParty, goMap, goBook, goTitle, tapPatch, tapOrb, beginGame, helpNow,
  tagTap: (correct) => { const g = G.enc.g; if (correct) { if (!g.up) { g.at = g.at < 0 ? 0 : g.at; GAME.tag.setUp(true); } GAME.tag.tap(g.at); } else GAME.tag.tap((Math.max(0, g.at) + 1) % 3); },
  snackPick: (correct) => { const g = G.enc.g; const live = g.choices.map((c, i) => i).filter(i => !g.btns[i].classList.contains('off')); const i = correct ? g.choices.indexOf(g.want) : (live.find(i => g.choices[i] !== g.want) ?? g.choices.indexOf(g.want)); GAME.snack.tap(i); },
  // tap the ring offsetMs away from the perfect moment
  ringTapAt: (offsetMs) => { const g = G.enc.g, P = GAME.ring.period() * G.spd; if (!g.stop) g.t0 = performance.now() - P * GAME.ring.TP - offsetMs * G.spd; GAME.ring.tap(); },
  ringWin: () => GAME.ring.win(), ringPeriod: () => GAME.ring.period(),
} };
})();
</script>
