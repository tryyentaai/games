/* ================= AUDIO ================= */
var AU={ctx:null,master:null,sfx:null,mus:null,noise:null,next:0,step:0,on:false};
function audioInit(){if(AU.ctx){if(AU.ctx.state!=='running'){try{AU.ctx.resume()}catch(e){}}return}
 var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{AU.ctx=new AC();AU.master=AU.ctx.createGain();AU.master.gain.value=0.9;AU.master.connect(AU.ctx.destination);
  AU.sfx=AU.ctx.createGain();AU.sfx.connect(AU.master);AU.mus=AU.ctx.createGain();AU.mus.gain.value=0.0;AU.mus.connect(AU.master);
  AU.vox=AU.ctx.createGain();AU.vox.gain.value=1.0;AU.vox.connect(AU.master);
  var len=AU.ctx.sampleRate*0.5,b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;

function tone(f,t0,dur,type,vol,f2,dest){var c=AU.ctx;if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
 g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||AU.sfx);o.start(t0);o.stop(t0+dur+0.02)}

function sfx(n,arg){if(!S.settings.sound||!AU.ctx||AU.ctx.state!=='running')return;var t=AU.ctx.currentTime+0.005;
 try{switch(n){
 case'jump':tone(330,t,0.16,'square',0.07,660);break;

var SCALE=[0,2,4,7,9,12,14,16];
function musicTick(){var c=AU.ctx;if(!c||c.state!=='running')return;
 var want=S.settings.music&&(G.scene==='play'||G.scene==='title'||G.scene==='map'||G.scene==='closet')?0.055:0;
 AU.mus.gain.setTargetAtTime(want,c.currentTime,0.3);if(!want){AU.next=c.currentTime+0.1;return}

function genStage(w,s){
 var idx=stageIdx(w,s),seed=idx*7919+((S.plays[idx]||0)%5)*104729+11,R=mulberry(seed),d=stageD(w,s);
 var L={w:w,s:s,idx:idx,d:d,speed:3.9+0.3*d,solids:[],haz:[],pads:[],coins:[],chunks:[],finishX:0,minY:0,seed:seed};
 var x=0,gy=0,ideas=PLAN[w][s],newIdea=ideas[0];
 var air=2*CFG.jv/CFG.g,jd=L.speed*air;
 function ground(x0,len,y,st){var o={x:x0,y:y,w:len,h:40,st:st||'g'};L.solids.push(o);return o}
 function block(x0,len,y,h,ex){var o={x:x0,y:y,w:len,h:h,st:'p'};if(ex)for(var k in ex)o[k]=ex[k];L.solids.push(o);return o}
 function arc(tx,y0,n,vx){for(var i=1;i<=n;i++){var t=i*air/(n+1);L.coins.push({x:tx+vx*t,y:y0+CFG.jv*t-0.5*CFG.g*t*t+0.75,got:false,gold:false})}}
 function line(x0,y0,n){for(var i=0;i<n;i++)L.coins.push({x:x0+i*0.9,y:y0+0.75,got:false,gold:false})}
 function chunk(kind,counted){var c={i:L.chunks.length,kind:kind,x0:x,x1:0,rx:x+0.8,ry:gy,tx:[],counted:counted,rescue:false,fails:0,hint:0,done:false,attempt:false};L.chunks.push(c);return c}
 function bridge(c,x0,len,y){var b=block(x0,len,y,0.55,{st:'b',bridge:c.i});return b}
 var make={
  run:function(){var c=chunk('run',false),len=4+R()*2;ground(x,len,gy);line(x+0.8,gy,3);x+=len;c.x1=x},
  gap:function(){var c=chunk('gap',true),g=1.3+0.28*d+R()*0.3,dh=0;if(w===2&&R()<0.5)dh=R()<0.5?0.5:-0.8;
   ground(x,3,gy);var e=x+3;c.tx.push(e-0.3);arc(e-0.3,gy,4,L.speed);bridge(c,e,g,gy);
   gy+=dh;ground(e+g,2.2,gy);x=e+g+2.2;c.x1=e+g+1.0},
  step:function(){var c=chunk('step',true),hh=1,two=d>=1.6&&R()<0.6;
   ground(x,3,gy);var wx=x+3;c.tx.push(wx-1.25);var len=two?1.8:2.6;ground(wx,len,gy+hh);arc(wx-1.25,gy,3,L.speed);
   if(two){c.tx.push(wx+len-1.25);ground(wx+len,2.4,gy+2*hh);ground(wx+len+2.4,2.4,gy);x=wx+len+4.8;c.x1=wx+len+2.4}
   else{ground(wx+len,2.4,gy);x=wx+len+2.4;c.x1=wx+len+0.8}},
  hot:function(){var c=chunk('hot',true),len=1+0.2*d+R()*0.2;ground(x,3+len+2.4,gy);var hx=x+3;
   L.haz.push({x:hx,y:gy,w:len,h:0.35,ch:c.i});var tx=Math.min(hx-0.5,hx+len/2-jd/2);c.tx.push(tx);arc(tx,gy,4,L.speed);
   x=hx+len+2.4;c.x1=hx+len+1.0},
  island:function(){var c=chunk('island',true),n=d>=2?3:2,y=gy;ground(x,3,gy);var e=x+3;
   for(var i=0;i<n;i++){var g=1.15+0.22*d+R()*0.25,wI=Math.max(1.5,2.5-0.2*d),dh=(R()-0.4)*(0.5+0.25*d);
    var ny=clamp(y+dh,gy-1.2,gy+1.4);if(ny>y+1.1)ny=y+1.1;
    c.tx.push(e-0.3);arc(e-0.3,y,3,L.speed);bridge(c,e,g,Math.min(y,ny));block(e+g,wI,ny,0.9,{st:'i'});y=ny;e=e+g+wI}
   var g2=1.15+0.2*d;c.tx.push(e-0.3);bridge(c,e,g2,Math.min(y,gy));ground(e+g2,2.4,gy);x=e+g2+2.4;c.x1=e+g2+1.0},
  mover:function(){var c=chunk('mover',true),g1=1.35+0.1*d,mw=Math.max(1.6,2.1-0.1*d);ground(x,3,gy);var e=x+3;
   c.tx.push(e-0.3);var m=block(e+g1,mw,gy,0.7,{st:'m',mv:{by:gy-0.1,amp:0.35+0.15*d,per:2.8,ph:R()*6.28,ch:c.i,gy:gy,fz:0}});
   bridge(c,e,g1,gy);bridge(c,e+g1+mw,g1,gy);c.tx.push(e+g1+mw-0.3);arc(e-0.3,gy,3,L.speed);
   ground(e+2*g1+mw,2.4,gy);x=e+2*g1+mw+2.4;c.x1=e+2*g1+mw+1.0},
  pad:function(){var c=chunk('pad',false),g=4.2;ground(x,3.2,gy);L.pads.push({x:x+2.0,y:gy,w:1.0,ch:c.i,sq:0});
   var e=x+3.2;bridge(c,e,g,gy);var t,lx=x+2.0-CFG.pw/2,bs=CFG.padBoost;for(var i=1;i<=6;i++){t=i*0.14;L.coins.push({x:lx+L.speed*t+bs*(t-(1-Math.exp(-10*t))/10),y:gy+CFG.padV*t-0.5*CFG.g*t*t+0.75,got:false,gold:false})}
   ground(e+g,3,gy);x=e+g+3;c.x1=e+g+1.2},
  crumble:function(){var c=chunk('crumble',false),n=5;ground(x,2.6,gy);var e=x+2.6;
   for(var i=0;i<n;i++)block(e+i,1,gy,0.8,{st:'c',cr:{t:-1,del:Math.max(0.28,0.5-0.04*d),ch:c.i,dy:0,vy:0}});
   bridge(c,e,n,gy-0.02);line(e+0.4,gy,4);ground(e+n,2.4,gy);x=e+n+2.4;c.x1=e+n+0.8}
 };
 // start
 ground(-6,12,0);x=6;line(2.5,0,3);
 var obstacles=12,seq=[],lastK='';
 for(var i=0;i<obstacles;i++){var k;
  if(i<3)k=newIdea;else{var tries=0;do{k=ideas[Math.floor(R()*ideas.length)];tries++}while(k===lastK&&ideas.length>1&&tries<4)}
  seq.push(k);lastK=k}
 // first stage of the game: start gentle with a gap-only warmup
 for(var j=0;j<seq.length;j++){make[seq[j]]();if(j%3===2&&j<seq.length-1)make.run();if(gy<L.minY)L.minY=gy}
 // golden coin
 if(R()<0.75&&L.coins.length>12){var gi=8+Math.floor(R()*(L.coins.length-10));L.coins[gi].gold=true}
 // finish
 var fc=chunk('finish',false);ground(x,12,gy,'g');L.finishX=x+5;fc.x1=x+12;x+=12;L.end=x;L.finishY=gy;
 for(var q=0;q<L.solids.length;q++){var so=L.solids[q];if(so.y-1<L.minY)L.minY=so.y-1}
 return L}

/* ================= STAGE FLOW ================= */
function startStage(w,s){
 G.L=genStage(w,s);S.lastWorld=w;G.mapWorld=w;
 G.p={x:0.5,y:0,vx:0,vy:0,gr:null,coy:0,buf:0,jumps:0,sched:null,blocked:false,blockT:0,state:'ready',t:0.7,sq:0,runPh:0,mag:0,magT:0,float:false,hotT:0,lastTap:null,trailT:0,blink:0,face:null,faceT:0,winT:0};
 G.p.gr=G.L.solids[0];
 G.ci=0;G.consec=0;G.streak=0;G.megaDone=false;G.parts.length=0;G.pops.length=0;G.timeScale=1;G.hand=null;
 G.stage={t:0,fails:0,rescues:0,coins:0,gold:0,att:0,succ:0,rsucc:0,maxConsec:0,firstTry:0,stalls:0};
 G.cam.x=G.p.x-camLead();G.cam.y=G.p.y-camLow();
 G.tut=(!S.tut&&w===0&&s===0)?{phase:'run',wait:false,waitT:0,demos:0}:null;
 G.scene='play';G.end=null;G.a=assistLevel();
 say(G.tut?'go':(s===0?WORLDS[w].vo:'go'),true);
}
function camLead(){return (W/U)*(W<H?0.22:0.3)}
function camLow(){return (H/U)*(W<H?0.38:0.3)}
function curChunk(){return G.L.chunks[Math.min(G.ci,G.L.chunks.length-1)]}
function nextTx(x){var L=G.L;for(var i=G.ci;i<Math.min(L.chunks.length,G.ci+2);i++){var c=L.chunks[i];for(var j=0;j<c.tx.length;j++)if(c.tx[j]>x-0.05)return c.tx[j]}return null}

function solidActive(s){if(s.bridge!=null&&!G.L.chunks[s.bridge].rescue)return false;if(s.cr&&s.cr.dy<-0.05)return false;return true}
function hazActive(h){return !G.L.chunks[h.ch].rescue}

function doJump(){var p=G.p;
 if(p.gr||p.coy>0){p.vy=CFG.jv;p.gr=null;p.coy=0;p.jumps=1;p.sq=0.25;sfx('jump');dust(p.x,p.y,5)}
 else if(p.jumps<2){p.vy=Math.max(p.vy,CFG.jv2);p.jumps=2;p.sq=0.2;sfx('jump2');sparkle(p.x,p.y+0.4,6,'#fff')}
 else{p.buf=0.1+0.15*G.a;return}
 p.sched=null;p.buf=0}

function tap(){G.taps++;G.idleT=0;var p=G.p;if(!p)return;p.lastTap=G.stage.t;
 if(G.tut&&G.tut.wait){G.tut.wait=false;G.tut.phase='jumped';G.timeScale=1;G.hand=null;doJump();G.tut.tapped=true;return}
 if(p.state==='ready'){p.buf=0.2;return}
 if(p.state!=='run')return;
 if(p.gr){var tx=nextTx(p.x),win=0.4+2.0*G.a;if(tx!=null&&tx-p.x>0.04&&tx-p.x<=win){p.sched=tx;return}doJump()}
 else doJump()}

var NEAR=[];
function predictLanding(x,y,vx,vy,gm){var L=G.L,dt=0.02;NEAR.length=0;var hi=x+Math.max(1,vx)*2.4;
 for(var j=0;j<L.solids.length;j++){var sj=L.solids[j];if(sj.x+sj.w>x-1.5&&sj.x<hi&&solidActive(sj))NEAR.push(sj)}
 for(var i=0;i<110;i++){vy-=CFG.g*gm*dt;var nx=x+vx*dt,ny=y+vy*dt;
  if(vy<=0){for(var k=0;k<NEAR.length;k++){var s=NEAR[k];
    if(nx+0.28>s.x&&nx-0.28<s.x+s.w&&y>=s.y-0.02&&ny<=s.y){var run=s.x+s.w-nx;if(run<0.6&&!contAt(s.x+s.w,s.y))return{x:nx,safe:false,y:s.y};return{x:nx,safe:!hazAt(nx,s.y),y:s.y}}}}
  x=nx;y=ny;if(y<L.minY-3)return{x:x,safe:false}}
 return{x:x,safe:true}}
function contAt(x,y){for(var i=0;i<NEAR.length;i++){var s=NEAR[i];if(Math.abs(s.x-x)<0.05&&s.y>=y-0.1&&s.y<=y+1.2)return true}return false}
function hazAt(x,y){var L=G.L;for(var i=0;i<L.haz.length;i++){var h=L.haz[i];if(!hazActive(h))continue;if(Math.abs(h.y-y)<0.2&&x+0.3>h.x&&x-0.3<h.x+h.w)return true}return false}

function fail(why){var p=G.p,c=curChunk();if(p.state!=='run')return;
 p.state='poof';p.t=0.5;sfx('poof');sfx('boop');poof(p.x,p.y+0.7);G.shake=0.15;
 c.fails++;G.stage.fails++;G.consec++;G.streak=0;G.stage.maxConsec=Math.max(G.stage.maxConsec,G.consec);
 if(c.counted){G.stage.att++;record(false)}c.attempt=false;
 if(G.consec>=2&&!c.rescue){c.rescue=true;G.stage.rescues++;G.pendingBridge=true}
 else if(c.fails===1){c.hint=1}
}
function stallFail(){var c=curChunk();G.p.blockT=0;G.stage.stalls++;c.fails++;G.stage.fails++;G.consec++;G.streak=0;G.stage.maxConsec=Math.max(G.stage.maxConsec,G.consec);
 if(c.counted){G.stage.att++;record(false)}
 if(G.consec>=2&&!c.rescue){c.rescue=true;G.stage.rescues++;say('watch',true)}else{c.hint=1;say('try',true)}}
function record(ok){G.recent.push(ok?1:0);if(G.recent.length>10)G.recent.shift();
 if(G.recent.length>=6){var r=G.recent.reduce(function(a,b){return a+b},0)/G.recent.length;
  if(r>0.86)S.aDyn=clamp(S.aDyn-0.06,-0.35,0.5);else if(r<0.72)S.aDyn=clamp(S.aDyn+0.1,-0.35,0.5);G.a=assistLevel()}}
function respawn(){var p=G.p,c=curChunk(),L=G.L;p.x=c.rx;p.y=c.ry;p.vx=0;p.vy=0;p.jumps=0;p.sched=null;p.coy=0;p.buf=0;p.mag=0;p.boost=0;p.blockT=0;p.hotT=0;
 p.gr=null;for(var i=0;i<L.solids.length;i++){var s=L.solids[i];if(s.cr&&s.cr.ch===c.i){s.cr.t=-1;s.cr.dy=0;s.cr.vy=0}}
 p.state='ready';p.t=0.55;sfx('spawn');sparkle(p.x,p.y+0.7,10,'#fff3a0');p.face='oops';p.faceT=0.8;
 if(G.pendingBridge){G.pendingBridge=false;sfx('bridge');say(c.kind==='hot'?'bridge':'bridge',true);G.bridgeFx=1;
  for(var j=0;j<L.solids.length;j++){var b=L.solids[j];if(b.bridge===c.i)sparkle(b.x+b.w/2,b.y,8,'#ffe066')}}
 else if(c.fails===1&&c.counted){var vo={hot:'hot',mover:'mover'}[c.kind]||'oops';say(vo)}}
function passChunk(c){
 if(c.counted){G.stage.att++;G.stage.succ++;if(!c.fails)G.stage.firstTry++;record(true);G.streak++;celebrateStreak()}
 if(c.rescue)G.stage.rsucc++;G.consec=0;c.done=true;c.hint=0;if(c.counted||c.i%3===0)save()}
var STREAK=[[2,'Nice!','n1'],[4,'Great!','n2'],[6,'Super!','n3'],[9,'Amazing!','n4'],[12,'LEGENDARY!','n5']];
function celebrateStreak(){for(var i=0;i<STREAK.length;i++)if(G.streak===STREAK[i][0]){pop(STREAK[i][1],i);sfx('pop',i);say(STREAK[i][2]);if(i>=3)G.shake=0.2;confetti(G.p.x+2,G.p.y+3,14+i*6)}
 if(G.streak>=6&&!G.megaDone){G.megaDone=true;G.p.star=5;sfx('star');setTimeout(function(){say('mega')},700);for(var k=0;k<8;k++)G.flyCoins.push({x:W/2+(RND()-0.5)*W*0.6,y:H*0.45+(RND()-0.5)*80,t:-k*0.08});G.stage.coins+=8;S.coins+=8}}

/* ================= PHYSICS ================= */
function physStep(dt){var p=G.p,L=G.L;if(!p||!L)return;
 // world objects
 for(var i=0;i<L.solids.length;i++){var s=L.solids[i];
  if(s.mv){var m=s.mv;s.py=s.y;if(L.chunks[m.ch].rescue)m.fz=Math.min(1,m.fz+dt*2.5);s.y=lerp(m.by+m.amp*Math.sin(G.stage.t*6.283/m.per+m.ph),m.gy,m.fz)}
  if(s.cr){var cr=s.cr;if(cr.t>=0){cr.t+=dt;if(cr.t>cr.del){cr.vy-=26*dt;cr.dy+=cr.vy*dt}}}}
 for(var q=0;q<L.pads.length;q++)L.pads[q].sq=Math.max(0,L.pads[q].sq-dt*3);
 if(p.star)p.star=Math.max(0,p.star-dt);
 if(p.faceT>0){p.faceT-=dt;if(p.faceT<=0)p.face=null}
 if(p.state==='poof'){p.t-=dt;if(p.t<=0)respawn();return}
 if(p.state==='win'){p.winT+=dt;p.vx=0;if(p.gr&&p.winT%0.8<dt*1.5&&p.winT<4){p.vy=8;p.gr=null}
  p.vy-=CFG.g*dt;p.y+=p.vy*dt;if(p.y<=L.finishY){p.y=L.finishY;p.vy=0;p.gr=true}
  if(p.winT>1.5&&!G.end)showEnd();return}
 var c=curChunk(),speed=L.speed;
 if(p.state==='ready'){p.t-=dt;p.vx=0;if(p.t<=0){p.state='run';if(p.buf>0&&p.gr){p.buf=0;doJump()}}}
 else{
  // tutorial freeze at first takeoff
  if(G.tut&&G.tut.phase==='run'&&p.gr){var t0=nextTx(p.x);if(t0!=null&&t0-p.x<0.12){G.tut.phase='wait';G.tut.wait=true;G.tut.waitT=0;G.hand={x:t0,y:p.y,tap:true};say('tap',true)}}
  if(G.tut&&G.tut.wait){p.vx=0;G.tut.waitT+=dt;
   if(G.tut.waitT>7&&!G.tut.v2){G.tut.v2=1;say('tap',true)}
   if(G.tut.waitT>10){G.tut.wait=false;G.tut.demos=(G.tut.demos||0)+1;G.tut.phase=G.tut.demos>=2?'off':'demo';G.hand=null;say('watch',true);doJump();if(G.tut.phase==='off')G.tut=null}
   return}
  var target=speed*(p.star?1.08:1)+p.mag+(p.boost||0);p.vx=lerp(p.vx,target,Math.min(1,dt*10));
 }
 // scheduled smart jump
 if(p.sched!=null){if(!p.gr||p.x>p.sched+0.6)p.sched=null;else if(p.x>=p.sched-0.02)doJump()}
 // rescue on walls: auto hop
 if(p.blocked&&p.gr&&p.state==='run'){if(c.rescue){doJump();sparkle(p.x+0.3,p.y+0.3,6,'#ffe066')}else if(p.lastTap!=null&&G.stage.t-p.lastTap<0.7+0.6*G.a){doJump()}}
 // gravity
 var gm=1;if(!p.gr&&p.vy<0&&p.float)gm=1-0.42*G.a;
 p.vy-=CFG.g*gm*dt;if(p.vy<-24)p.vy=-24;
 if(p.coy>0)p.coy-=dt;if(p.buf>0)p.buf-=dt;
 // horizontal move + walls
 var px0=p.x,hw=CFG.pw/2;p.x+=p.vx*dt;p.blocked=false;
 for(var k=0;k<L.solids.length;k++){var so=L.solids[k];if(!solidActive(so))continue;var top=so.y+(so.cr?so.cr.dy:0);
  if(p.y+0.06<top&&p.y+CFG.ph>top-so.h&&p.x+hw>so.x&&p.x-hw<so.x+so.w&&(px0+hw<=so.x+0.001||p.x<so.x+0.35)){p.x=so.x-hw;p.blocked=true;p.vx=0}}
 if(p.blocked&&p.gr&&p.state==='run'){p.blockT+=dt;if(p.blockT>1.2&&!c.rescue)stallFail()}else p.blockT=0;
 // vertical move + landing
 var py0=p.y,wasGr=!!p.gr,landed=null;
 if(p.gr&&p.gr.mv&&p.vy<=0&&solidActive(p.gr)&&p.x+hw>p.gr.x&&p.x-hw<p.gr.x+p.gr.w){p.y=p.gr.y;p.vy=0;landed={s:p.gr,y:p.gr.y}}
 else{p.y+=p.vy*dt;
 if(p.vy<=0){for(var k2=0;k2<L.solids.length;k2++){var s2=L.solids[k2];if(!solidActive(s2))continue;var tp=s2.y+(s2.cr?s2.cr.dy:0),ptp=s2.mv?(s2.py!=null?s2.py:tp):tp;
   if(p.x+hw>s2.x&&p.x-hw<s2.x+s2.w&&py0>=Math.min(tp,ptp)-0.06&&p.y<=tp){if(!landed||tp>landed.y)landed={s:s2,y:tp}}}}
 else{for(var k3=0;k3<L.solids.length;k3++){var s3=L.solids[k3];if(!solidActive(s3))continue;var bot=s3.y-s3.h;
   if(p.x+hw-0.05>s3.x&&p.x-hw+0.05<s3.x+s3.w&&py0+CFG.ph<=bot+0.01&&p.y+CFG.ph>bot){p.y=bot-CFG.ph;p.vy=0}}}}
 if(landed){p.y=landed.y;if(!wasGr&&py0>landed.y+0.05){sfx('land');p.sq=-0.22;dust(p.x,p.y,4)}p.vy=0;p.gr=landed.s;p.jumps=0;p.float=false;p.mag=0;p.boost=0;
  if(landed.s.cr&&landed.s.cr.t<0){landed.s.cr.t=0;sfx('crack')}
  if(p.buf>0&&p.state==='run'){p.buf=0;doJump()}}
 else{if(p.gr){p.coy=0.07+0.2*G.a}p.gr=null}
 // pads
 for(var q2=0;q2<L.pads.length;q2++){var pd=L.pads[q2];if(p.x+hw>pd.x&&p.x-hw<pd.x+pd.w&&p.y<pd.y+2.2&&p.y>pd.y-0.6&&p.vy<9){p.vy=CFG.padV;p.boost=CFG.padBoost;p.gr=null;p.jumps=1;pd.sq=1;p.sq=0.35;sfx('boing');say('whoa');sparkle(pd.x+0.5,pd.y+0.2,10,'#fff')}}
 // air magnet
 if(!p.gr&&p.state==='run'){p.magT-=dt;if(p.magT<=0){p.magT=0.05;var pr=predictLanding(p.x,p.y,p.vx,p.vy,1);
   if(pr.safe){p.float=false;p.mag=lerp(p.mag,0,0.5)}
   else{p.float=true;var maxDv=0.6+3.0*G.a,best=null,sp0=speed+(p.boost||0);
