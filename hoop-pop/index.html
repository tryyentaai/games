<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoop Pop">
<meta name="theme-color" content="#1d1442">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Hoop Pop</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1d1442;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",system-ui,sans-serif;color:#fff}
#c{position:fixed;left:0;top:0;display:block;touch-action:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.scr{position:fixed;inset:0;display:none;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
.scr.on{display:flex}
.scr>*{pointer-events:auto}
#sAdult{pointer-events:auto}
.dim{background:rgba(20,10,50,.62)}
.col{flex-direction:column;align-items:center}
.center{align-items:center;justify-content:center}
button{font-family:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
.btn{min-width:64px;min-height:64px;border:none;border-radius:26px;font-size:26px;font-weight:bold;color:#fff;
  background:#ff5a5f;box-shadow:0 6px 0 rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;
  gap:10px;padding:10px 26px;margin:8px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn svg{width:34px;height:34px;flex:none}
.btn.green{background:#22c55e}.btn.blue{background:#3d8bfd}.btn.purple{background:#9b59ff}.btn.orange{background:#ff9f1c}
.btn.big{font-size:38px;padding:16px 46px;border-radius:34px;min-height:88px}
.btn.big svg{width:46px;height:46px}
.btn.icon{padding:0;width:64px;height:64px;border-radius:22px}
.tix{display:flex;align-items:center;gap:6px;background:#fff;color:#c2410c;font-weight:bold;font-size:26px;
  border-radius:20px;padding:8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tix svg{width:30px;height:30px}
.logo{margin-top:22vh;text-align:center;line-height:.92;font-weight:900;font-size:min(22vw,120px);
  color:#ffd43b;text-shadow:0 6px 0 #c2410c,0 10px 18px rgba(0,0,0,.45);transform:rotate(-4deg);pointer-events:none}
.logo span{display:block}.logo span+span{color:#fff;text-shadow:0 6px 0 #ee4b3e,0 10px 18px rgba(0,0,0,.45)}
#sTitle .menu{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;pointer-events:none}
#sTitle .menu>*{pointer-events:auto}
.corner-tr{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.corner-tl{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px))}
.gear{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.gear svg.g{width:34px;height:34px}
.gear svg.ring{position:absolute;inset:0;width:64px;height:64px;transform:rotate(-90deg)}
.gear svg.ring circle{fill:none;stroke:#ffd43b;stroke-width:5;stroke-dasharray:188;stroke-dashoffset:188}
.gear.hold svg.ring circle{transition:stroke-dashoffset 2s linear;stroke-dashoffset:0}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;box-sizing:border-box}
.ttl{font-size:34px;font-weight:bold;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:max-content;gap:14px;width:min(94vw,760px);
  padding:6px 4px 90px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-height:calc(100% - 90px);box-sizing:border-box}
.card{position:relative;border:none;border-radius:26px;background:#fff7e8;color:#3b2a5a;padding:10px 6px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.25);font-size:24px;font-weight:bold;
  min-height:178px;height:auto;line-height:1.15;margin:0}
.card>div{flex:none}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card canvas{width:86px;height:86px}
.card .num{position:absolute;left:10px;top:8px;width:34px;height:34px;border-radius:50%;background:#3d8bfd;color:#fff;
  font-size:20px;display:flex;align-items:center;justify-content:center}
.card .stars{display:flex;gap:2px}.card .stars svg{width:24px;height:24px}
.card.locked{background:#cfc6e6;color:#7a6f96}
.card.locked canvas{opacity:.35}
.card .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .lock svg{width:46px;height:46px;color:#5b4f7d}
.card.next{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.card .price{display:flex;align-items:center;gap:4px;color:#c2410c}.card .price svg{width:24px;height:24px}
.card.own{background:#e6fbe9}.card.own .price{color:#16a34a}
.card.cant canvas{filter:brightness(0) opacity(.25)}
.card.can{animation:pulse 1.4s ease-in-out infinite}
.party{background:#fff7e8;color:#3b2a5a;border-radius:34px;padding:22px 18px 16px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);
  width:min(90vw,520px);box-sizing:border-box;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
#pWord{font-size:52px;font-weight:900;color:#ff5a5f}
.pstars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.pstars svg{width:68px;height:68px;color:#e2dcef;transform:scale(0)}
.pstars svg.lit{color:#ffc93c}
.pstars svg.in{transition:transform .35s cubic-bezier(.2,1.8,.4,1);transform:scale(1)}
.prow{display:flex;justify-content:center;align-items:center;gap:14px;font-size:30px;font-weight:bold;margin:6px 0}
.prow svg{width:34px;height:34px}
.btnrow{display:flex;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btnrow .btn{font-size:24px;padding:8px 18px}
#pDone{display:none;font-size:26px;color:#6d5d9a;margin:6px 0}
#pDone svg{width:40px;height:40px;vertical-align:middle;color:#9b59ff}
.adult{background:#fff;color:#2a2340;border-radius:24px;padding:18px;width:min(92vw,460px);max-height:88vh;overflow-y:auto;box-sizing:border-box;
  font-family:system-ui,-apple-system,sans-serif;touch-action:pan-y}
.adult h2{margin:0 0 4px;font-size:24px}.adult p{margin:0 0 12px;color:#6b6385;font-size:14px}
.arow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #eee;font-size:18px;gap:10px}
.seg{display:flex;gap:6px}
.seg button,.tog{min-width:64px;min-height:64px;border-radius:14px;border:2px solid #d9d3ea;background:#f6f3fc;font-size:16px;font-weight:600;color:#3b2a5a;font-family:system-ui,sans-serif}
.seg button.on,.tog.on{background:#3d8bfd;border-color:#3d8bfd;color:#fff}
.adult input{font-size:18px;padding:10px;border-radius:12px;border:2px solid #d9d3ea;width:150px;-webkit-user-select:text;user-select:text}
.adult .done{width:100%;margin:14px 0 0;background:#22c55e;font-family:system-ui,sans-serif;font-size:22px}
#sGame .hud-l{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
#sGame .hud-r{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px))}
#sGame .btn.icon{margin:0;background:rgba(61,40,120,.88)}
@media (max-height:520px) and (orientation:landscape){
  .logo{margin-top:calc(12vh + env(safe-area-inset-top,0px));font-size:19vh}
  #sTitle .menu{flex-direction:row;justify-content:center;bottom:calc(4vh + env(safe-area-inset-bottom,0px))}
  .btn.big{font-size:30px;min-height:72px;padding:10px 32px}
}
#bHelp svg text{font-family:"Chalkboard SE","Comic Sans MS",system-ui,sans-serif}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>

<div id="sTitle" class="scr col">
  <div class="logo"><span>Hoop</span><span>Pop</span></div>
  <div class="menu">
    <button class="btn big green" id="bPlay" data-say="Play!"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z"/></svg>Play</button>
    <button class="btn orange" id="bPrizes1" data-say="Prizes!"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="10" width="17" height="10.5" rx="1.5"/><rect x="2.5" y="7" width="19" height="4" rx="1.2"/><rect x="11" y="7" width="2" height="13.5" fill="#fff" opacity=".7"/><circle cx="9" cy="5.3" r="2.3"/><circle cx="15" cy="5.3" r="2.3"/></svg>Prizes</button>
  </div>
  <div class="tix corner-tr" data-say="Tickets"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5h18v3.6a2 2 0 0 0 0 3.8v3.6H3v-3.6a2 2 0 0 0 0-3.8z"/></svg><span class="tixn">0</span></div>
  <button class="gear" aria-label="Grown-ups"><svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29.5"/></svg><svg class="g" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.1 3.2"/><circle cx="12" cy="12" r="6" fill="currentColor"/><circle cx="12" cy="12" r="2.4" fill="#2a1d55"/></svg></button>
</div>

<div id="sMap" class="scr col dim">
  <div class="top">
    <button class="btn icon blue" id="bHome" data-say="Home"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9.5 8.3h-3v9.2h-5v-6h-3v6h-5v-9.2h-3z"/></svg></button>
    <div class="ttl" data-say="Pick one!">Pick one!</div>
    <div class="tix" data-say="Tickets"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5h18v3.6a2 2 0 0 0 0 3.8v3.6H3v-3.6a2 2 0 0 0 0-3.8z"/></svg><span class="tixn">0</span></div>
  </div>
  <div class="grid" id="mapGrid"></div>
</div>

<div id="sGame" class="scr">
  <button class="btn icon hud-l" id="bBack" data-say="Map"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg></button>
  <button class="btn icon hud-r" id="bHelp" data-say="Help"><svg viewBox="0 0 24 24"><text x="12" y="19.5" text-anchor="middle" font-size="21" font-weight="900" fill="currentColor">?</text></svg></button>
</div>

<div id="sParty" class="scr center dim">
  <div class="party">
    <div id="pWord">Great!</div>
    <div class="pstars" id="pStars"></div>
    <div class="prow"><span id="pScore">0</span><span style="display:flex;align-items:center;gap:4px;color:#c2410c"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5h18v3.6a2 2 0 0 0 0 3.8v3.6H3v-3.6a2 2 0 0 0 0-3.8z"/></svg>+<span id="pTix">0</span></span></div>
    <div id="pDone"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M14.5 2.5a9.5 9.5 0 1 0 7 15.8A8 8 0 0 1 14.5 2.5z"/></svg> All done!</div>
    <div class="btnrow">
      <button class="btn green" id="bAgain" data-say="Again?"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 4.5V1.5L7 6l5 4.5V7.5a5 5 0 1 1-5 5H4.5A7.5 7.5 0 1 0 12 4.5z"/></svg>Again</button>
      <button class="btn blue" id="bMap2" data-say="Map"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>Map</button>
      <button class="btn orange" id="bPrizes2" data-say="Prizes!"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="10" width="17" height="10.5" rx="1.5"/><rect x="2.5" y="7" width="19" height="4" rx="1.2"/><rect x="11" y="7" width="2" height="13.5" fill="#fff" opacity=".7"/><circle cx="9" cy="5.3" r="2.3"/><circle cx="15" cy="5.3" r="2.3"/></svg>Prizes</button>
    </div>
  </div>
</div>

<div id="sPrizes" class="scr col dim">
  <div class="top">
    <button class="btn icon blue" id="bPBack" data-say="Back"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.5 4.5L3 12l7.5 7.5 1.8-1.8-4.4-4.4H21v-2.6H7.9l4.4-4.4z"/></svg></button>
    <div class="ttl" data-say="Prizes!">Prizes</div>
    <div class="tix" data-say="Tickets"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5h18v3.6a2 2 0 0 0 0 3.8v3.6H3v-3.6a2 2 0 0 0 0-3.8z"/></svg><span class="tixn">0</span></div>
  </div>
  <div class="grid" id="prizeGrid"></div>
</div>

<div id="sAdult" class="scr center dim">
  <div class="adult">
    <h2>Grown-ups</h2>
    <p>Settings are saved on this device. Hoop Pop has no ads, purchases, links or data collection.</p>
    <div class="arow">Sound <button class="tog" data-set="sound">On</button></div>
    <div class="arow">Music <button class="tog" data-set="music">On</button></div>
    <div class="arow">Voice <button class="tog" data-set="voice">On</button></div>
    <div class="arow">Help level <div class="seg" data-seg="assist"><button data-v="0">Low</button><button data-v="1">Med</button><button data-v="2">High</button></div></div>
    <div class="arow">Kid's name <input id="aName" maxlength="14" autocomplete="off" placeholder="Name"></div>
    <div class="arow">Last-round reminder <div class="seg" data-seg="reminder"><button data-v="0">Off</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
    <button class="btn done" id="aDone">Done</button>
  </div>
</div>

<script>
(() => {
'use strict';
const SLUG = 'hoop-pop', SAVE_KEY = 'hoop-pop.save.v1';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* ---------------- save ---------------- */
const DEF = () => ({ v: 1, name: '', tickets: 0, prizes: [], stars: {}, unlocked: 1, tut: false, rounds: 0, best: {},
  settings: { sound: true, music: true, voice: true, assist: 1, reminder: 0 } });
const S = DEF();
function loadSave() {
  let o = null;
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) o = JSON.parse(raw); } catch (e) { o = null; }
  const d = DEF();
  if (o && typeof o === 'object') {
    try {
      d.name = typeof o.name === 'string' ? o.name.slice(0, 14) : '';
      d.tickets = Number.isFinite(o.tickets) ? Math.max(0, Math.floor(o.tickets)) : 0;
      d.prizes = Array.isArray(o.prizes) ? o.prizes.filter(p => PRIZES.some(q => q.id === p)).filter((p, i, a) => a.indexOf(p) === i) : [];
      if (o.stars && typeof o.stars === 'object') for (const k in o.stars) { const n = +o.stars[k]; if (n >= 1 && n <= 3) d.stars[k] = n; }
      if (o.best && typeof o.best === 'object') for (const k in o.best) { const n = +o.best[k]; if (Number.isFinite(n)) d.best[k] = n; }
      d.unlocked = Number.isFinite(o.unlocked) ? clamp(Math.floor(o.unlocked), 1, 9) : 1;
      d.tut = !!o.tut; d.rounds = Number.isFinite(o.rounds) ? o.rounds : 0;
      const s = o.settings || {};
      d.settings.sound = s.sound !== false; d.settings.music = s.music !== false; d.settings.voice = s.voice !== false;
      d.settings.assist = [0, 1, 2].includes(s.assist) ? s.assist : 1;
      d.settings.reminder = [0, 3, 5].includes(s.reminder) ? s.reminder : 0;
    } catch (e) { Object.assign(d, DEF()); }
  }
  Object.assign(S, d);
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- content ---------------- */
const COL = { 10: '#3d8bfd', 20: '#22c55e', 30: '#ff9f1c', 50: '#9b59ff', 100: '#ff4d6d' };
const CNAME = { 10: 'blue', 20: 'green', 30: 'orange', 50: 'purple', 100: 'red' };
const WORD = { 10: 'Nice!', 20: 'Good!', 30: 'Great!', 50: 'WOW!', 100: 'SUPER!' };
const LADDER = [10, 20, 30, 50, 100];
const L5 = () => [
  { v: 10, nx: .22, ny: .9 }, { v: 20, nx: .78, ny: .9 }, { v: 30, nx: .5, ny: .66 },
  { v: 50, nx: .24, ny: .42 }, { v: 100, nx: .74, ny: .26 }];
function mv(list, moves) { for (const m of moves) { const h = list.find(x => x.v === m.v); if (h) h.move = m; } return list; }
const STAGES = [
  null,
  { id: 1, name: 'Toss', intro: 'Tap a hoop!', t: [180, 300], hoops: () => [{ v: 10, nx: .26, ny: .9 }, { v: 20, nx: .74, ny: .86 }, { v: 30, nx: .5, ny: .58 }] },
  { id: 2, name: 'Up High', intro: 'Up high is more!', t: [370, 630], hoops: L5 },
  { id: 3, name: 'Slide', intro: 'Watch them slide!', t: [370, 630], hoops: () => mv(L5(), [{ v: 100, k: 'slide', a: .18, sp: 1.1 }, { v: 30, k: 'slide', a: .22, sp: .8 }]) },
  { id: 4, name: 'Bounce', intro: 'Watch them bounce!', t: [370, 630], hoops: () => mv(L5(), [{ v: 50, k: 'bob', a: .1, sp: 1.3 }, { v: 100, k: 'bob', a: .08, sp: 1.6 }, { v: 20, k: 'slide', a: .08, sp: .9 }]) },
  { id: 5, name: 'Gold', intro: 'Find the gold!', gold: .45, t: [450, 780], hoops: L5 },
  { id: 6, name: 'Colors', intro: 'Get the color I say!', colors: true, t: [450, 780], hoops: () => mv(L5(), [{ v: 30, k: 'slide', a: .18, sp: .7 }]) },
  { id: 7, name: 'Steps', intro: 'Go in order!', ladder: true, t: [500, 900], hoops: L5 },
  { id: 8, name: 'Party', intro: 'Party time!', gold: .12, t: [450, 780], hoops: () => mv(L5(), [
    { v: 10, k: 'slide', a: .08, sp: .7 }, { v: 20, k: 'bob', a: .05, sp: 1.1 }, { v: 30, k: 'circle', a: .14, sp: .9 },
    { v: 50, k: 'slide', a: .14, sp: 1 }, { v: 100, k: 'circle', a: .1, sp: 1.2 }]) },
  { id: 9, name: 'Play All', intro: 'Play all!', free: true, t: [450, 840], hoops: null }
];
const PRIZES = [
  { id: 'bear', n: 'Bear', c: 20 }, { id: 'duck', n: 'Duck', c: 35 }, { id: 'frog', n: 'Frog', c: 50 },
  { id: 'cat', n: 'Cat', c: 65 }, { id: 'fish', n: 'Fish', c: 80 }, { id: 'owl', n: 'Owl', c: 100 },
  { id: 'dino', n: 'Dino', c: 120 }, { id: 'whale', n: 'Whale', c: 140 }, { id: 'bunny', n: 'Bunny', c: 170 },
  { id: 'rocket', n: 'Rocket', c: 200 }, { id: 'star', n: 'Star', c: 235 }, { id: 'crown', n: 'Crown', c: 280 }];
const BALLS = 15;

/* ---------------- canvas + layout ---------------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, dprScale = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
let bgCache = null;
function readSafe() {
  try { const cs = getComputedStyle($('probe'));
    safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0; } catch (e) {}
}
function resize() {
