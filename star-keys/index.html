<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.hbtns{display:flex;gap:10px;pointer-events:none}

 text-shadow:0 5px 0 #6a35c4,0 9px 18px rgba(0,0,0,.45);animation:bob 3s ease-in-out infinite}

 color:#2a1650;background:linear-gradient(#ffffff,#e6d9ff);box-shadow:0 6px 0 #9a7be0,0 10px 20px rgba(0,0,0,.3);
 padding:8px 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a7be0,0 4px 10px rgba(0,0,0,.3)}
.btn img{display:block;pointer-events:none}
.btn.icon{padding:6px;width:64px;height:64px;border-radius:20px}
.btn.go{font-size:42px;padding:12px 46px 12px 30px;border-radius:40px;background:linear-gradient(#8dffaa,#2fc46a);color:#063d1f;
 box-shadow:0 8px 0 #1a8a47,0 14px 26px rgba(0,0,0,.35);animation:bob 1.6s ease-in-out infinite}

.scroll{pointer-events:auto;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;width:100%;flex:1;
 -webkit-overflow-scrolling:touch;padding:10px 4px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px;max-width:940px;margin:0 auto}
.card{pointer-events:auto;border:0;font:inherit;border-radius:26px;background:linear-gradient(#fff,#ece2ff);color:#2a1650;
 box-shadow:0 6px 0 #9a7be0,0 10px 20px rgba(0,0,0,.3);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:manipulation}

.sbig{margin:6px 0 0;animation:bob 2.4s ease-in-out infinite}
.modes{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:14px;max-width:760px}

.btn.mode.sug{background:linear-gradient(#fff7c2,#ffd23c);box-shadow:0 6px 0 #d99a00,0 10px 20px rgba(0,0,0,.3);animation:bob 1.6s ease-in-out infinite}

 padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px)}

@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spinin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 0 #9a7be0,0 0 0 0 rgba(255,210,60,.9)}50%{transform:scale(1.1);box-shadow:0 6px 0 #9a7be0,0 0 0 12px rgba(255,210,60,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>

<body>

<script>
'use strict';
(function(){
const SAVE_KEY='star-keys.save.v1';
const FONT='"Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif';
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d'), ui=$('#ui');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- music data ---------- */
const NC=['#ff5a6e','#ff9a3c','#ffd23c','#4fd65e','#2fd0c3','#4aa3ff','#a77bff','#ff6fd2'];
const LET=['C','D','E','F','G','A','B','C'];
const SOL=['Do','Re','Mi','Fa','Sol','La','Ti','Do'];
const SAY_LET={C:'see',D:'dee',E:'ee',F:'eff',G:'jee',A:'ay',B:'bee'};
const FREQ=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];
const CHORD=[0,4,0,3,0,3,4,0];
const LEAD=2.2;
const SONGS=[
 {id:'buns',name:'Hot Cross Buns',icon:'bun',bpm:84,m:'E1 D1 C2 E1 D1 C2 C.5 C.5 C.5 C.5 D.5 D.5 D.5 D.5 E1 D1 C2'},
 {id:'lamb',name:'Little Lamb',icon:'lamb',bpm:92,m:'E1 D1 C1 D1 E1 E1 E2 D1 D1 D2 E1 G1 G2 E1 D1 C1 D1 E1 E1 E1 E1 D1 D1 E1 D1 C4'},
 {id:'joy',name:'Ode to Joy',icon:'sun',bpm:92,m:'E1 E1 F1 G1 G1 F1 E1 D1 C1 C1 D1 E1 E1.5 D.5 D2 E1 E1 F1 G1 G1 F1 E1 D1 C1 C1 D1 E1 D1.5 C.5 C2'},
 {id:'bells',name:'Jingle Bells',icon:'bells',bpm:100,m:'E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2 E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 F1 F1 F1 F1 F1 E1 E1 E.5 E.5 G1 G1 F1 D1 C4'},
 {id:'saints',name:'The Saints',icon:'trumpet',bpm:108,m:'C1 E1 F1 G4 C1 E1 F1 G4 C1 E1 F1 G2 E2 C2 E2 D4 E1 E1 D2 C3 C1 E2 G2 G1 F3 E1 F1 G2 E2 C2 D2 C4'},
 {id:'star',name:'Twinkle Star',icon:'twinkle',bpm:92,m:'C1 C1 G1 G1 A1 A1 G2 F1 F1 E1 E1 D1 D1 C2 G1 G1 F1 F1 E1 E1 D2 G1 G1 F1 F1 E1 E1 D2 C1 C1 G1 G1 A1 A1 G2 F1 F1 E1 E1 D1 D1 C2'},
 {id:'bridge',name:'London Bridge',icon:'bridge',bpm:96,m:'G1.5 A.5 G1 F1 E1 F1 G2 D1 E1 F2 E1 F1 G2 G1.5 A.5 G1 F1 E1 F1 G2 D2 G2 E1 C3'},
 {id:'farm',name:'Old MacDonald',icon:'barn',bpm:104,m:'C1 C1 C1 G1 A1 A1 G2 E1 E1 D1 D1 C3 G1 C1 C1 C1 G1 A1 A1 G2 E1 E1 D1 D1 C4'},
 {id:'boat',name:'Row Your Boat',icon:'boat',bpm:88,m:'C1.5 C1.5 C1 D.5 E1.5 E1 D.5 E1 F.5 G3 c.5 c.5 c.5 G.5 G.5 G.5 E.5 E.5 E.5 C.5 C.5 C.5 G1 F.5 E1 D.5 C3'}
];
SONGS.forEach(s=>{const out=[];let beat=0;for(const tok of s.m.trim().split(/\s+/)){const ch=tok[0],b=parseFloat(tok.slice(1));if(ch!=='R'){const i=ch==='c'?7:'CDEFGAB'.indexOf(ch);out.push({i,beat,beats:b});}beat+=b;}s.parsed={notes:out,beats:beat};s.range=Math.max(...out.map(n=>n.i))+1;});
const MODES=[{id:'learn',name:'Learn',icon:'turtle',k:0,say:'Learn! Stars wait for you.'},{id:'play',name:'Play',icon:'comet',k:1,say:'Play! Tap with the music.'},{id:'echo',name:'Echo',icon:'echo',k:2,say:'Echo! Listen, then play.'}];
const SOUNDS=[{id:'piano',name:'Piano',at:0,icon:'keys'},{id:'box',name:'Music Box',at:2,icon:'box'},{id:'bell',name:'Bells',at:7,icon:'bell'},{id:'kitty',name:'Kitty',at:14,icon:'kitty'},{id:'space',name:'Space',at:18,icon:'rocket'}];
const WORLDS=[
 {id:'night',name:'Night',at:0,bg:['#120a38','#2c1867','#3d2185'],p:'star'},
 {id:'candy',name:'Candy',at:4,bg:['#7a2a8a','#c2408f','#ff7ab8'],p:'heart'},
 {id:'ocean',name:'Ocean',at:10,bg:['#042049','#0b4a8f','#1878c8'],p:'bubble'},
 {id:'forest',name:'Forest',at:22,bg:['#062918','#0f4d2e','#2f8f4e'],p:'leaf'},
 {id:'gold',name:'Gold',at:26,bg:['#2a1700','#6a4300','#b8860b'],p:'spark'}];
WORLDS.forEach(w=>w.icon='w_'+w.id);
const UNLOCKS=[...SOUNDS.filter(x=>x.at>0).map(x=>({...x,kind:'sound'})),...WORLDS.filter(x=>x.at>0).map(x=>({...x,kind:'world'}))].sort((a,b)=>a.at-b.at);
const ASSIST={more:{w:1.4,t:.9},normal:{w:1,t:1},less:{w:.8,t:1.1}};

/* ---------- save ---------- */
const DEF=()=>({v:1,stars:{},crowns:{},gems:0,seen:{},tut:false,rounds:0,sound:'piano',world:'night',
 adapt:{tempo:.85,win:1,echo:3},
 settings:{sound:true,music:true,voice:true,assist:'normal',name:'',labels:'letters',remind:0}});
let S=DEF();
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object')S=Object.assign(DEF(),o);}}catch(e){S=DEF();}sanitize();}
function sanitize(){
 const d=DEF();
 try{
  for(const k of Object.keys(d)) if(S[k]===undefined||S[k]===null||typeof S[k]!==typeof d[k]) S[k]=d[k];
  for(const k of Object.keys(d.settings)) if(typeof S.settings[k]!==typeof d.settings[k]) S.settings[k]=d.settings[k];
  for(const k of Object.keys(d.adapt)) if(typeof S.adapt[k]!=='number'||!isFinite(S.adapt[k])) S.adapt[k]=d.adapt[k];
  S.adapt.tempo=clamp(S.adapt.tempo,.6,1.2);S.adapt.win=clamp(S.adapt.win,.85,1.8);S.adapt.echo=clamp(Math.round(S.adapt.echo),2,6);
  if(typeof S.stars!=='object'||Array.isArray(S.stars)) S.stars={};
  SONGS.forEach(s=>{const a=S.stars[s.id];S.stars[s.id]=Array.isArray(a)?[0,1,2].map(k=>a[k]?1:0):[0,0,0];S.crowns[s.id]=!!S.crowns[s.id];});
  if(!ASSIST[S.settings.assist]) S.settings.assist='normal';
  if(!['letters','solfa','none'].includes(S.settings.labels)) S.settings.labels='letters';
  if(![0,3,5,8].includes(S.settings.remind)) S.settings.remind=0;
  S.settings.name=String(S.settings.name).replace(/[^\p{L} '-]/gu,'').slice(0,16);
  const ts=totalStars();
  const snd=SOUNDS.find(x=>x.id===S.sound); if(!snd||snd.at>ts) S.sound='piano';
  const w=WORLDS.find(x=>x.id===S.world); if(!w||w.at>ts) S.world='night';
  S.gems=Math.max(0,S.gems|0);
 }catch(e){S=DEF();}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function totalStars(){let n=0;for(const s of SONGS){const a=S.stars[s.id];if(a)n+=a[0]+a[1]+a[2];}return n;}
function unlocked(i){return i===0||(S.stars[SONGS[i-1].id]||[0,0,0]).some(Boolean);}
function suggest(){
 const seq=[];SONGS.forEach((s,i)=>{seq.push([i,0],[i,1]);if(i>0)seq.push([i-1,2]);});seq.push([SONGS.length-1,2]);
 for(const [i,m] of seq){if(!unlocked(i))continue;if(!S.stars[SONGS[i].id][m])return{si:i,mode:MODES[m].id};}
 return{si:Math.floor(Math.random()*SONGS.length),mode:'play'};
}

/* ---------- audio ---------- */
const A={ctx:null};let ACTIVE=[];
function audioInit(){
 try{
  if(!A.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;A.ctx=new C();
   const comp=A.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(A.ctx.destination);
   A.master=A.ctx.createGain();A.master.gain.value=.9;A.master.connect(comp);
   A.notes=A.ctx.createGain();A.notes.gain.value=.9;A.notes.connect(A.master);
   A.sfx=A.ctx.createGain();A.sfx.gain.value=.8;A.sfx.connect(A.master);
   A.music=A.ctx.createGain();A.music.gain.value=.55;A.music.connect(A.master);
   const len=A.ctx.sampleRate*.5|0;A.noise=A.ctx.createBuffer(1,len,A.ctx.sampleRate);const d=A.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
   const b=A.ctx.createBufferSource();b.buffer=A.ctx.createBuffer(1,1,22050);b.connect(A.ctx.destination);b.start(0);}
  if(A.ctx.state==='suspended')A.ctx.resume();
 }catch(e){}
}
const on=()=>A.ctx&&S.settings.sound;
function tone(type,f0,f1,dur,vol,dest,delay){if(!on())return;try{const c=A.ctx,t=c.currentTime+(delay||0);const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(dest||A.sfx);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function noise(dur,vol,ftype,f0,f1,dest,delay){if(!on())return;try{const c=A.ctx,t=c.currentTime+(delay||0);const s=c.createBufferSource();s.buffer=A.noise;const f=c.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t);s.stop(t+dur+.02);}catch(e){}}
const sfx={
 boop(){tone('sine',330,180,.2,.22);},
 click(){tone('sine',900,640,.06,.07);},
 sparkle(){for(let k=0;k<3;k++)tone('sine',rnd(1700,3100),null,.14,.05,null,k*.05);},
 chime(lv){const f=[523,659,784,1047,1319,1568,2093];for(let k=0;k<Math.min(f.length,lv+2);k++)tone('triangle',f[k],null,.3,.12,null,k*.07);},
 gold(){tone('sine',1568,null,.45,.12);tone('sine',2093,null,.55,.1,null,.07);this.sparkle();},
 whoosh(){noise(.6,.35,'bandpass',300,3200);},
 fanfare(){[523,659,784,1047].forEach((f,k)=>tone('triangle',f,null,.35,.13,null,k*.11));[523,659,784].forEach(f=>tone('triangle',f,null,.9,.07,null,.5));noise(.25,.12,'highpass',4000,null,null,.5);},
 kick(v){if(!S.settings.music)return;tone('sine',150,45,.18,.5*v,A&&A.music);},
 hat(d){if(!S.settings.music)return;noise(.05,.07,'highpass',7000,null,A&&A.music,d);},
 bass(f){if(!S.settings.music)return;tone('triangle',f,null,.4,.28,A&&A.music);},
 tick(){if(!S.settings.music)return;tone('square',1320,null,.05,.05,A&&A.music);}
};
function synth(i,vel){
 if(!on())return null;
 try{
  const c=A.ctx,t=c.currentTime,f=FREQ[i];const out=c.createGain();out.connect(A.notes);const nodes=[];let sustain=false,dur=2,kind=S.sound;
  const osc=(type,freq,gain,dest)=>{const o=c.createOscillator();o.type=type;o.frequency.value=freq;const g=c.createGain();g.gain.value=gain;o.connect(g);g.connect(dest||out);nodes.push(o);return o;};
  const env=(a,peak,dec)=>{out.gain.setValueAtTime(.0001,t);out.gain.linearRampToValueAtTime(peak,t+a);out.gain.exponentialRampToValueAtTime(.0008,t+a+dec);};

let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(!vs.length)return null;const pref=['Samantha','Karen','Moira','Tessa','Google US English','Microsoft Aria','Microsoft Jenny','Ava'];for(const p of pref){const v=vs.find(v=>v.name.indexOf(p)>=0);if(v)return v;}return vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){return null;}}
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice();};}catch(e){}
function say(text,queue){
 if(!S.settings.voice||!text)return;
 try{const ss=window.speechSynthesis;if(!ss)return;if(!queue)ss.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1.12;u.volume=1;if(!VOICE)VOICE=pickVoice();if(VOICE)u.voice=VOICE;ss.speak(u);}catch(e){}
}

 Object.assign(G,{notes:[],t:0,pi:0,tempo:1,winE:.2,winL:.3,spb:.6,hits:0,misses:0,wrongs:0,consec:0,maxConsec:0,streak:0,best:0,score:0,

/* ---------- layout ---------- */
let W=0,H=0,DPR=1,dprCap=2;const SAFE={t:0,r:0,b:0,l:0};
function readSafe(){try{const cs=getComputedStyle($('#safe'));SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function resize(){
 W=window.innerWidth;H=window.innerHeight;readSafe();DPR=Math.min(window.devicePixelRatio||1,dprCap);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 computeLayout();measurePip();initBg();
}
function computeLayout(){
 const n=G.lanes||8,L=G.L;
 const l=SAFE.l+10,r=W-SAFE.r-10;const maxW=Math.min(r-l,n*140);L.n=n;
 L.x0=(l+r)/2-maxW/2;L.x1=L.x0+maxW;L.lw=maxW/n;
 L.kbH=Math.round(clamp(H*.26,104,230));L.kbY=H-SAFE.b-L.kbH-8;
 L.top=SAFE.t+10+64+8;
 L.staffH=(H>=560&&G.mode!=='echo')?66:0;
 L.hwTop=L.top+(L.staffH?L.staffH+10:0)+8;
 L.padR=clamp(L.lw*.36,14,34);
 L.hitY=L.kbY-L.padR-14;
 L.pps=Math.max((L.hitY-L.hwTop)/LEAD,120);
}
function measurePip(){const sp=$('#pipspot');if(sp){const r=sp.getBoundingClientRect();G.pipBox={x:r.left+r.width/2,y:r.top+r.height/2,r:clamp(Math.min(r.width,r.height)*.36,26,150)};}else G.pipBox=null;}

/* ---------- background ---------- */
function world(){return WORLDS.find(w=>w.id===S.world)||WORLDS[0];}
function initBg(){G.bgP=[];const n=Math.round(clamp(W*H/16000,20,60));for(let k=0;k<n;k++)G.bgP.push({x:Math.random()*W,y:Math.random()*H,r:rnd(2,6),ph:Math.random()*TAU,sp:rnd(6,22)});}
function drawBg(c,dt){
 const w=world();const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,w.bg[0]);g.addColorStop(.6,w.bg[1]);g.addColorStop(1,w.bg[2]);c.fillStyle=g;c.fillRect(0,0,W,H);
 if(G.sp>0){c.save();c.globalAlpha=.18*Math.min(1,G.sp);const hg=c.createLinearGradient(0,0,W,0);for(let k=0;k<7;k++)hg.addColorStop(k/6,NC[(k+Math.floor(G.time*6))%7]);c.fillStyle=hg;c.fillRect(0,0,W,H);c.restore();}
 const rise=w.p==='bubble'||w.p==='spark',fall=w.p==='leaf'||w.p==='heart';
 for(const p of G.bgP){if(rise){p.y-=p.sp*dt;if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}}else if(fall){p.y+=p.sp*dt*.6;p.x+=Math.sin(G.time+p.ph)*.3;if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}}
  c.globalAlpha=.35+.45*(.5+.5*Math.sin(G.time*1.7+p.ph));drawParticle(c,w.p,p.x,p.y,p.r,G.time*.5+p.ph);}
 c.globalAlpha=1;
 if(G.comet){const m=G.comet;m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;const tg=c.createLinearGradient(m.x,m.y,m.x-m.vx*.35,m.y-m.vy*.35);tg.addColorStop(0,'rgba(255,255,255,.9)');tg.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=tg;c.lineWidth=4;c.beginPath();c.moveTo(m.x,m.y);c.lineTo(m.x-m.vx*.35,m.y-m.vy*.35);c.stroke();starPath(c,m.x,m.y,9,4,5,G.time*4);c.fillStyle='#fff6c2';c.fill();if(m.life<=0)G.comet=null;}
 else{G.cometT-=dt;if(G.cometT<=0){G.cometT=rnd(25,55);const fromL=Math.random()<.5;G.comet={x:fromL?-20:W+20,y:rnd(H*.05,H*.3),vx:(fromL?1:-1)*rnd(380,520),vy:rnd(60,140),life:3};}}
}

/* ---------- effects ---------- */
function burst(x,y,col,n,sp,type){for(let k=0;k<n;k++){if(G.parts.length>320)G.parts.shift();const a=Math.random()*TAU,v=rnd(sp*.3,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,g:600,life:rnd(.4,.8),max:.8,c:col,r:rnd(3,7),type:type||'dot',rot:Math.random()*TAU});}}
function popText(x,y,s,col,size){size=size||34;const hw=s.length*size*.32+8;x=clamp(x,hw+4,W-hw-4);G.texts.push({x,y,s,c:col,size:size||34,life:.9,max:.9});if(G.texts.length>8)G.texts.shift();}
function laneX(i){return G.L.x0+(i+.5)*G.L.lw;}
function fxHit(i,word,gold){const x=laneX(i),y=G.L.hitY;burst(x,y,NC[i],gold?26:14,gold?420:300,'dot');burst(x,y,'#ffffff',gold?10:4,260,'star');G.flash[i]=1;if(word)popText(x,y-G.L.padR-24,word,gold?'#ffd23c':'#ffffff',30);}
function updFx(dt){
 for(let k=G.parts.length-1;k>=0;k--){const p=G.parts[k];p.life-=dt;if(p.life<=0){G.parts.splice(k,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.rot+=dt*4;}
 for(let k=G.texts.length-1;k>=0;k--){const t=G.texts[k];t.life-=dt;t.y-=34*dt;if(t.life<=0)G.texts.splice(k,1);}
 for(let i=0;i<8;i++){G.keyT[i]=G.down[i]?1:Math.max(0,G.keyT[i]-dt*6);G.flash[i]=Math.max(0,G.flash[i]-dt*3);G.wob[i]=Math.max(0,G.wob[i]-dt*3);}
 G.shake=Math.max(0,G.shake-dt*30);if(G.countT>0)G.countT-=dt;
 for(let k=G.rel.length-1;k>=0;k--){if(G.time>=G.rel[k].at){G.rel[k].h.release(true);G.rel.splice(k,1);}}
}
function playKey(i,vel,autoRel){if(i<0||i>7)return;const h=synth(i,vel===undefined?1:vel);if(!h)return;if(G.vo[i])G.vo[i].release(true);G.vo[i]=h;if(autoRel)G.rel.push({h,at:G.time+autoRel});ACTIVE.push(h);if(ACTIVE.length>18){ACTIVE.shift().release(true);}}
function stopVoices(){ACTIVE.forEach(h=>h.release(true));ACTIVE=[];G.vo.fill(null);}

/* ---------- rounds ---------- */
function startRound(si,mode){
 si=clamp(si|0,0,SONGS.length-1);if(!unlocked(si))si=0;
 if(!['learn','play','echo'].includes(mode))mode='learn';
 stopVoices();newRound();
 const s=SONGS[si];G.si=si;G.mode=mode;G.song=s;G.lanes=Math.max(3,s.range);
 G.spb=60/s.bpm;const off=LEAD+.6;
 G.notes=s.parsed.notes.map((n,k)=>({k,i:n.i,t:off+n.beat*G.spb,dur:n.beats*G.spb,beats:n.beats,hit:false,miss:false,gold:false,bounce:0,cut:false}));
 if(mode!=='echo'){let lg=-9;G.notes.forEach((n,k)=>{if(k>=3&&k-lg>4&&Math.random()<1/12){n.gold=true;lg=k;}});}
 const last=G.notes[G.notes.length-1];G.songEnd=last.t+last.dur;
 if(mode==='play'){applyAdapt();G.nextBeat=off-4*G.spb;while(G.nextBeat<.15)G.nextBeat+=G.spb;G.beatI=Math.round((G.nextBeat-off)/G.spb);}
 G.scr='game';G.sess++;
 computeLayout();renderUI();
 const rem=S.settings.remind;if(rem&&G.sess>=rem)G.lastRound=true;
 let intro='';
 if(mode==='learn'){if(!S.tut&&si===0){G.demo={t:0,phase:0};intro='Tap when the star lands!';}else intro=S.seen.learn?'':'Find the keys!';S.seen.learn=1;}
 else if(mode==='play'){intro=S.seen.play?'Ready?':'Tap when stars land. Ready?';S.seen.play=1;}
 else{startEcho();intro=S.seen.echo?'':'Listen, then play!';S.seen.echo=1;}
 if(G.lastRound)intro=(intro?intro+' ':'')+'Last song for now!';
 if(intro)say(intro);
 save();
}
function startFree(){stopVoices();newRound();G.mode='free';G.song=null;G.lanes=8;G.scr='game';computeLayout();renderUI();if(!S.seen.free){say('Play any key!');S.seen.free=1;save();}}
function applyAdapt(){const am=ASSIST[S.settings.assist]||ASSIST.normal;G.tempo=clamp(S.adapt.tempo*am.t,.55,1.25);G.winE=.2*S.adapt.win*am.w;G.winL=.3*S.adapt.win*am.w;}
function pending(){while(G.pi<G.notes.length&&(G.notes[G.pi].hit||G.notes[G.pi].miss))G.pi++;return G.notes[G.pi]||null;}
function target(){
 if(G.mode==='learn'){const p=pending();return p?p.i:-1;}
 if(G.mode==='play')return G.waitNote?G.waitNote.i:-1;
 if(G.mode==='echo'&&G.E&&G.E.phase==='turn')return G.E.seq[G.E.k].i;
 return -1;
}
function resetHint(){G.idle=0;G.rung=0;G.tWrong=0;}
function nudge(){const t=target();if(t<0)return;if(G.mode==='echo')say('Your turn!');else say('Find '+noteSay(t)+'!');}
function hintTick(dt){
 if(!G.waiting){return;}
 G.idle+=dt;
 if(G.idle>=5&&G.rung<1)G.rung=1;
 if((G.idle>=10||G.tWrong>=2)&&G.rung<2){G.rung=2;nudge();}
 if(G.tWrong>=3&&G.rung<3)G.rung=3;
}
function help(){
 if(G.mode==='play'&&!G.waitNote){const p=pending();if(p){G.waitNote=p;}}
 if(G.mode==='echo'&&G.E&&G.E.phase==='turn'&&G.rung<1){G.rung=1;startListen();return;}
 G.rung=Math.min(3,G.rung+1);if(G.rung>=2)nudge();
}
function milestone(){
 const s=G.streak;let w=null,lv=0;
 if(s===5){w='Nice!';lv=1;}else if(s===10){w='WOW!';lv=2;}else if(s===30){w='LEGEND!';lv=4;}else if(s>30&&s%15===0){w='LEGEND!';lv=5;}
 if(s>=G.spNext&&G.mode==='play'){G.spNext+=16;G.sp=8;w='SUPER STAR!';lv=4;sfx.whoosh();G.shake=10;if(Math.random()<.5)say('Super star'+kidName()+'!');}
 if(w){popText(W/2,G.L.hwTop+60,w,'#ffd23c',w.length>8?40:48);sfx.chime(lv);G.shake=Math.max(G.shake,lv*2);for(let i=0;i<G.lanes;i++)G.flash[i]=Math.max(G.flash[i],.6);}
}

/* learn */
function updLearn(dt){
 const p=pending();
 if(p){G.t=Math.min(G.t+dt*G.tempo,p.t);G.waiting=G.t>=p.t-1e-6;}
 else{G.waiting=false;G.t+=dt;if(!G.endT)G.endT=G.t+1;else if(G.t>=G.endT)endRound();}
 if(G.demo&&G.waiting){const d=G.demo;d.t+=dt;if(d.phase===0&&d.t>=1.1){d.phase=1;const q=pending();if(q){G.keyT[q.i]=1;hitLearn(q,true);}}else if(d.phase===1&&d.t>=1.9){G.demo=null;G.tutHand=true;say('Your turn!');}}
 else if(G.demo&&G.demo.phase===1){G.demo.t+=dt;if(G.demo.t>=1.9){G.demo=null;G.tutHand=true;say('Your turn!');}}
}
function hitLearn(p,demo){
 p.hit=true;G.hits++;G.streak++;G.best=Math.max(G.best,G.streak);const clean=G.tWrong===0;
 playKey(p.i,1);fxHit(p.i,clean?'Great!':'Good!',p.gold);G.score+=(clean?15:10)+(p.gold?50:0);
 if(p.gold){G.golds++;sfx.gold();popText(laneX(p.i),G.L.hitY-G.L.padR-60,'+50','#ffd23c',28);}
 resetHint();
 if(!demo){G.tutHand=false;if(!S.tut){S.tut=true;save();}}
 milestone();
}
function wrongMove(lane){sfx.boop();G.wob[lane]=1;G.tWrong++;G.wrongs++;G.streak=0;const p=G.mode==='learn'?pending():G.waitNote;if(p)p.bounce=1;}
function pressLearn(lane){
 const p=pending();if(!p){playKey(lane,.6);return;}
 if(p.t-G.t>1.0){playKey(lane,.5);return;}
 if(lane===p.i)hitLearn(p,false);else wrongMove(lane);
}

/* play */
function updPlay(dt){
 let sp=G.tempo;if(G.missAt>=0){const q=pending();if(q&&(q.t-G.t)/G.tempo>.8)sp=G.tempo*4;}
 let nt=G.t+dt*sp;if(G.waitNote)nt=Math.min(nt,G.waitNote.t);G.t=nt;
 G.waiting=!!G.waitNote&&G.t>=G.waitNote.t-1e-6;
 const wl=G.winL*G.tempo;
 for(let k=G.pi;k<G.notes.length;k++){const n=G.notes[k];if(n.hit||n.miss)continue;if(n===G.waitNote)break;if(G.t-n.t>wl)missNote(n);else break;}
 const nx=pending();
 if(G.missAt>=0&&nx&&G.t>=nx.t-1e-6){const gap=(G.time-G.missAt);G.stats.maxGapAfterMiss=Math.max(G.stats.maxGapAfterMiss,gap);G.missAt=-1;}
 while(G.t>=G.nextBeat&&G.nextBeat<=G.songEnd+.01){beat();G.nextBeat+=G.spb;G.beatI++;}
 if(!nx){if(!G.endT)G.endT=G.t+1;else if((G.t>=G.endT&&!Object.keys(G.hold).length)||G.t>=G.endT+4)endRound();}
 if(G.sp>0)G.sp-=dt;
 for(const k in G.hold){const h=G.hold[k];if(!G.down[k]){delete G.hold[k];h.n.cut=true;}else if(G.t>=h.end){delete G.hold[k];G.score+=20;popText(laneX(h.n.i),G.L.hitY-G.L.padR-30,'Hold!','#ffffff',26);sfx.sparkle();burst(laneX(h.n.i),G.L.hitY,NC[h.n.i],12,260,'star');}}
}
function beat(){
 const i=G.beatI;
 if(i<0){G.countTxt=String(5+i);G.countT=.6;sfx.tick();return;}
 if(i===0){G.countTxt='Go!';G.countT=.6;}
 sfx.kick(i%2===0?1:.6);
 if(A.ctx)sfx.hat(G.spb/G.tempo/2);
 if(i%2===0){let r=0;for(let k=G.pi;k<G.notes.length;k++){if(G.notes[k].t>=G.nextBeat-.05){r=CHORD[G.notes[k].i];break;}}sfx.bass(FREQ[r]/4);}
}
function missNote(n){
 n.miss=true;G.misses++;G.consec++;G.maxConsec=Math.max(G.maxConsec,G.consec);G.streak=0;chunk(false);G.missAt=G.time;
 const need=S.adapt.win>=1.3||S.settings.assist==='more'?1:2;if(G.consec>=need&&!G.waitNote){for(const m of G.notes){if(!m.hit&&!m.miss&&m.t>=n.t&&m!==n){G.waitNote=m;G.rescues++;resetHint();break;}}}
}
function pressPlay(lane){
 const winE=G.winE*G.tempo,winL=G.winL*G.tempo;let best=null,bd=1e9,other=false;
 for(let k=G.pi;k<G.notes.length;k++){const n=G.notes[k];if(n.t-G.t>winE+1e-6)break;if(n.hit||n.miss)continue;const d=G.t-n.t;if(d>winL||d<-winE-1e-6)continue;if(n.i!==lane){other=true;continue;}if(Math.abs(d)<bd){best=n;bd=Math.abs(d);}}
 if(best){const d=G.t-best.t;const q=d<0?-d/winE:d/winL;hitPlay(best,best===G.waitNote?0:q);}
 else if(other){wrongMove(lane);}
 else playKey(lane,.45);
}
function hitPlay(n,q){
 n.hit=true;G.missAt=-1;G.hits++;G.consec=0;if(n===G.waitNote){G.waitNote=null;resetHint();}
 G.streak++;G.best=Math.max(G.best,G.streak);chunk(true);
 const word=q<.4?'Super!':q<.75?'Great!':'Good!';const base=q<.4?20:q<.75?15:10;const mult=Math.min(4,1+Math.floor(G.streak/8));
 G.score+=base*mult*(G.sp>0?2:1);
 playKey(n.i,1);fxHit(n.i,word,n.gold);
 if(n.gold){G.golds++;G.score+=50;sfx.gold();popText(laneX(n.i),G.L.hitY-G.L.padR-60,'+50','#ffd23c',28);}
 if(n.beats>=2)G.hold[n.i]={n,end:n.t+n.dur*.75};
 milestone();
}
function chunk(hit){
 G.chunkN++;if(hit)G.chunkH++;
 if(G.chunkN>=6){const acc=G.chunkH/G.chunkN;if(acc>=.9){G.up++;G.down2=0;}else if(acc<.6){G.down2++;G.up=0;}else{G.up=0;G.down2=0;}
  if(G.up>=2){S.adapt.tempo=Math.min(1.2,S.adapt.tempo*1.06);S.adapt.win=Math.max(.85,S.adapt.win*.94);G.up=0;applyAdapt();}
  if(G.down2>=2){S.adapt.tempo=Math.max(.6,S.adapt.tempo*.9);S.adapt.win=Math.min(1.8,S.adapt.win*1.18);G.down2=0;applyAdapt();}
  G.chunkN=0;G.chunkH=0;}
}

/* echo */
function startEcho(){const src=G.song.parsed.notes;G.E={src,pos:0,count:0,max:Math.min(8,Math.ceil(src.length/2)),phase:'gap',gapT:1.6,seq:[],k:0,times:[],playT:0,playI:0,endT:0,wrongs:0,clean:0,messy:0,lit:[],firstTurn:true};}
function nextChunk(){const E=G.E;if(E.pos>=E.src.length||E.count>=E.max){endRound();return;}const L=S.adapt.echo|0;let seq=E.src.slice(E.pos,E.pos+L);if(E.src.length-(E.pos+L)===1)seq=E.src.slice(E.pos,E.pos+L+1);E.seq=seq;E.pos+=seq.length;E.k=0;E.wrongs=0;startListen();}
function startListen(){const E=G.E;E.phase='listen';E.playT=-.45;E.playI=0;let t=0;E.times=E.seq.map(n=>{const at=t;t+=clamp(n.beats*G.spb*1.05,.4,.85);return at;});E.endT=t;E.lit=[];G.waiting=false;}
function updEcho(dt){
 const E=G.E;if(!E)return;
 if(E.phase==='gap'){E.gapT-=dt;if(E.gapT<=0)nextChunk();}
 else if(E.phase==='listen'){E.playT+=dt;while(E.playI<E.seq.length&&E.playT>=E.times[E.playI]){const n=E.seq[E.playI];playKey(n.i,.9,.4);G.keyT[n.i]=1;G.flash[n.i]=1;burst(laneX(n.i),G.L.hitY,NC[n.i],8,200,'dot');E.lit[E.playI]=true;E.playI++;}
  if(E.playI>=E.seq.length&&E.playT>=E.endT+.2){E.phase='turn';G.waiting=true;G.idle=0;popText(W/2,G.L.hitY-G.L.padR-70,'Your turn!','#ffffff',34);if(E.firstTurn||E.count<1)say('Your turn!');E.firstTurn=false;}}
 else if(E.phase==='turn')G.waiting=true;
}
function pressEcho(lane){
 const E=G.E;if(!E||E.phase!=='turn'){playKey(lane,.5,.3);return;}
 const exp=E.seq[E.k].i;
 if(lane===exp){playKey(lane,1,.4);burst(laneX(lane),G.L.hitY,NC[lane],12,260,'dot');G.flash[lane]=1;E.k++;G.idle=0;if(G.tWrong<3)G.rung=0;
  if(E.k>=E.seq.length)echoDone();}
 else{sfx.boop();G.wob[lane]=1;E.wrongs++;G.tWrong++;G.wrongs++;if(E.wrongs===2){say('Listen!');startListen();}}
}
function echoDone(){
 const E=G.E;E.phase='gap';E.gapT=1.1;E.count++;G.hits+=E.seq.length;G.waiting=false;
 const clean=E.wrongs===0;G.score+=15*E.seq.length+(clean?20:0);G.streak=clean?G.streak+1:0;G.best=Math.max(G.best,G.streak);
 const words=['Yes!','Nice!','Great!','Super!','WOW!'];popText(W/2,G.L.hitY-G.L.padR-70,words[Math.min(4,E.count-1)],'#ffd23c',42);sfx.chime(Math.min(4,E.count));
 for(let i=0;i<G.lanes;i++){G.flash[i]=.8;burst(laneX(i),G.L.hitY,NC[i],5,240,'star');}
 if(clean){E.clean++;E.messy=0;if(E.clean>=2){S.adapt.echo=Math.min(6,S.adapt.echo+1);E.clean=0;}}
 else if(E.wrongs>=2){E.messy++;E.clean=0;if(E.messy>=2){S.adapt.echo=Math.max(2,S.adapt.echo-1);E.messy=0;}}
 resetHint();
}

/* free */
function pressFree(lane){playKey(lane,1);burst(laneX(lane),G.L.hitY,NC[lane],10,260,'dot');G.parts.push({x:laneX(lane),y:G.L.hitY,vx:rnd(-20,20),vy:-rnd(160,220),g:0,life:1.6,max:1.6,c:NC[lane],r:G.L.padR*.8,type:'gem',lab:noteLabel(lane),rot:0});G.hist.push(lane);if(G.hist.length>9)G.hist.shift();G.flash[lane]=1;}

/* input */
function press(lane){
 if(G.scr!=='game'||lane<0)return;
 if(lane>=G.lanes){playKey(lane,.5);return;}
 G.keyT[lane]=1;G.dc[lane]++;G.down[lane]=true;
 if(G.demo&&G.demo.phase===0){G.demo=null;G.tutHand=true;}
 if(G.mode==='free')pressFree(lane);else if(G.mode==='learn')pressLearn(lane);else if(G.mode==='play')pressPlay(lane);else if(G.mode==='echo')pressEcho(lane);
}
function release(lane){if(lane<0||lane>7)return;G.dc[lane]=Math.max(0,G.dc[lane]-1);if(!G.dc[lane]){G.down[lane]=false;if(G.vo[lane])G.vo[lane].release();}}
function laneAt(x,y){const L=G.L;if(y<L.hitY-L.padR-30)return -1;if(x<L.x0-20||x>L.x1+20)return -1;return clamp(Math.floor((x-L.x0)/L.lw),0,G.lanes-1);}
const PTR={};
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(G.scr!=='game')return;const ln=laneAt(e.clientX,e.clientY);if(ln<0)return;PTR[e.pointerId]=ln;try{cv.setPointerCapture(e.pointerId);}catch(_){}press(ln);},{passive:false});
cv.addEventListener('pointermove',e=>{if(G.mode!=='free'||!(e.pointerId in PTR))return;const ln=laneAt(e.clientX,e.clientY);if(ln>=0&&ln!==PTR[e.pointerId]){release(PTR[e.pointerId]);PTR[e.pointerId]=ln;press(ln);}});
function ptrUp(e){if(e.pointerId in PTR){release(PTR[e.pointerId]);delete PTR[e.pointerId];}}
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);cv.addEventListener('lostpointercapture',ptrUp);
const KEYMAP={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7,'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7};
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const ln=KEYMAP[e.key&&e.key.toLowerCase()];if(ln===undefined||e.repeat)return;audioInit();press(ln);});
window.addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const ln=KEYMAP[e.key&&e.key.toLowerCase()];if(ln!==undefined)release(ln);});
const PC={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function onMidi(m){try{const[st,note,vel]=m.data;const cmd=st&0xf0;const pc=note%12;if(!(pc in PC))return;let ln=PC[pc];if(ln===0&&note>=72&&G.lanes===8)ln=7;if(cmd===0x90&&vel>0){audioInit();press(ln);}else if(cmd===0x80||(cmd===0x90&&vel===0))release(ln);}catch(e){}}
function connectMidi(){try{if(!navigator.requestMIDIAccess){say('No piano found.');return false;}navigator.requestMIDIAccess().then(acc=>{const bind=()=>{let n=0;for(const inp of acc.inputs.values()){inp.onmidimessage=onMidi;n++;}G.midiN=n;renderUI();};bind();acc.onstatechange=bind;}).catch(()=>{G.midiN=-1;renderUI();});return true;}catch(e){return false;}}

/* ---------- end ---------- */
function endRound(){
 if(G.scr!=='game'||G.ended)return;G.ended=true;
 const s=G.song,mk={learn:0,play:1,echo:2}[G.mode];const before=totalStars();const st=S.stars[s.id];const had=st[mk];const firstEver=!st.some(Boolean);
 st[mk]=1;let crown=false;const total=G.notes.length;const hits=G.mode==='echo'?G.hits:G.hits;
 if(G.mode==='play'&&G.hits/total>=.85&&!S.crowns[s.id]){S.crowns[s.id]=true;crown=true;}
 S.rounds++;S.gems+=G.golds;const after=totalStars();
 const unl=UNLOCKS.filter(u=>u.at>before&&u.at<=after);
 save();
 G.endInfo={mk,newStar:!had,crown,firstEver,unl,score:G.score,hits,total:G.mode==='echo'?hits:total};
 stopVoices();G.scr='end';renderUI();sfx.fanfare();
 for(let k=0;k<140;k++)G.parts.push({x:rnd(0,W),y:rnd(-H*.4,-10),vx:rnd(-40,40),vy:rnd(80,220),g:40,life:rnd(2.5,4.5),max:4.5,c:NC[k%8],r:rnd(5,9),type:'conf',rot:Math.random()*TAU});
 let line=['Great job','You did it','Super','Wow'][Math.floor(Math.random()*4)]+kidName()+'!';
 if(G.lastRound)line+=' That was the last song for now.';
 else if(unl.length)line+=' You got a new '+unl[0].kind+'!';
 say(line);
}

function grownTpl(){const st=S.settings;const o=(k,v,l)=>`<button class="opt ${st[k]===v?'on':''}" data-act="g:${k}:${v}">${l}</button>`;const t=(k,l)=>`<button class="opt ${st[k]?'on':''}" data-act="g:${k}:t">${l}: ${st[k]?'On':'Off'}</button>`;
 return`<div class="modal"><div class="panel gp"><h2>Grown-ups</h2>
 <div class="gr"><label>Kid's name</label><input id="kname" maxlength="16" autocomplete="off" value="${st.name.replace(/"/g,'')}" placeholder="Name"></div>
 <div class="gr"><label>Sound</label>${t('sound','Sound')}${t('music','Beat')}${t('voice','Voice')}</div>
 <div class="gr"><label>Help level</label>${o('assist','more','More')}${o('assist','normal','Normal')}${o('assist','less','Less')}</div>
 <div class="gr"><label>Key labels</label>${o('labels','letters','C D E')}${o('labels','solfa','Do Re Mi')}${o('labels','none','None')}</div>
 <div class="gr"><label>Last-song nudge</label>${o('remind',0,'Off')}${o('remind',3,'3 songs')}${o('remind',5,'5')}${o('remind',8,'8')}</div>
 <div class="gr"><label>Real piano</label><button class="opt" data-act="g:midi">${G.midiN>0?`Connected (${G.midiN})`:G.midiN===-1?'Not allowed':'Connect MIDI'}</button></div>
 <div class="note">MIDI keyboards work in Chrome or Edge on a computer. Computer keys A S D F G H J K play C to high C. Progress: ${totalStars()} of 27 stars.</div>
 <div class="row"><button class="btn go2" data-act="g:done">Done</button></div></div></div>`;}
function renderUI(){
 let h=(TPL[G.scr]||TPL.home)();if(G.grown)h+=grownTpl();ui.innerHTML=h;
 const kn=$('#kname');if(kn)kn.addEventListener('input',()=>{S.settings.name=kn.value.replace(/[^\p{L} '-]/gu,'').slice(0,16);save();});
 requestAnimationFrame(measurePip);
}
function show(scr){G.scr=scr;G.parts.length=0;G.texts.length=0;if(scr!=='game'){G.mode=null;G.lanes=8;computeLayout();}renderUI();}
function goHome(){stopVoices();G.parts.length=0;show('home');}
ui.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const now=performance.now();if(now<uiLock)return;uiLock=now+320;audioInit();sfx.click();
 const a=b.dataset.act;if(b.dataset.say)say(b.dataset.say);
 try{act(a,b);}catch(err){console.error(err);goHome();}
});
function act(a,b){
 const [k,v,w]=a.split(':');
 switch(k){
  case 'go':{const sg=suggest();startRound(sg.si,sg.mode);break;}
  case 'songs':show('songs');break;
  case 'free':startFree();break;
  case 'stuff':show('stuff');break;
  case 'home':goHome();break;
  case 'song':{const i=+v;if(!unlocked(i)){sfx.boop();say('Play the song before!');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);return;}G.si=i;show('song');break;}
  case 'mode':startRound(G.si,v);break;
  case 'again':startRound(G.si,G.mode||'learn');break;
  case 'next':{const sg=suggest();startRound(sg.si,sg.mode);break;}
  case 'quit':stopVoices();if(G.mode==='free')goHome();else show('song');break;
  case 'help':help();break;
  case 'listen':if(G.E&&G.E.phase==='turn'){startListen();}break;
  case 'stk':{const s=SONGS[+v];if(!S.stars[s.id].some(Boolean)){sfx.boop();return;}s.parsed.notes.slice(0,4).forEach((n,j)=>setTimeout(()=>playKey(n.i,.8,.4),250+j*320));break;}
  case 'snd':case 'wld':{const list=k==='snd'?SOUNDS:WORLDS;const it=list.find(x=>x.id===v);if(!it)return;if(totalStars()<it.at){sfx.boop();say('Get '+it.at+' stars!');return;}
   if(k==='snd'){S.sound=v;[0,2,4,7].forEach((n,j)=>setTimeout(()=>playKey(n,.8,.35),150+j*160));}else{S.world=v;initBg();sfx.sparkle();}save();renderUI();break;}
  case 'g':{if(v==='done'){G.grown=false;save();renderUI();break;}if(v==='midi'){connectMidi();break;}
   const st=S.settings;if(w==='t')st[v]=!st[v];else if(v==='remind')st[v]=+w;else st[v]=w;if(v==='voice'&&!st.voice){try{speechSynthesis.cancel();}catch(e){}}save();renderUI();break;}
 }
}
let holdTimer=null;
ui.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-hold]');if(!g)return;g.classList.add('holding');clearTimeout(holdTimer);holdTimer=setTimeout(()=>{g.classList.remove('holding');G.grown=true;sfx.chime(1);renderUI();},2000);});
const cancelHold=()=>{clearTimeout(holdTimer);holdTimer=null;document.querySelectorAll('.holding').forEach(x=>x.classList.remove('holding'));};
ui.addEventListener('pointerup',cancelHold);ui.addEventListener('pointercancel',cancelHold);ui.addEventListener('pointerleave',cancelHold,true);

/* ---------- render ---------- */
function render(dt){
 const c=cx;c.setTransform(DPR,0,0,DPR,0,0);
 drawBg(c,dt);
 if(G.scr==='game')drawGame(c);
 else if(G.scr==='home'&&G.pipBox){const p=G.pipBox;drawPip(c,p.x,p.y+Math.sin(G.time*2)*6,p.r,1,G.time);for(let k=0;k<3;k++){const a=G.time*.8+k*TAU/3;drawGem(c,p.x+Math.cos(a)*p.r*1.9,p.y+Math.sin(a)*p.r*.7,p.r*.22,NC[k*2],'',false,.9,false,G.time);}}
 drawParts(c);
}
function drawParts(c){
 for(const p of G.parts){const a=clamp(p.life/(p.max*.6),0,1);c.globalAlpha=a;
  if(p.type==='star'){starPath(c,p.x,p.y,p.r*1.4,p.r*.55,4,p.rot);c.fillStyle=p.c;c.fill();}
  else if(p.type==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.c;c.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9);c.restore();p.x+=Math.sin(G.time*3+p.rot)*.6;}
  else if(p.type==='gem'){c.globalAlpha=1;drawGem(c,p.x,p.y,p.r,p.c,p.lab,false,a,false,G.time);}
  else{c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r*a+1,0,TAU);c.fill();}}
 c.globalAlpha=1;
 for(const t of G.texts){const k=t.life/t.max,sc=k>.8?1+(k-.8)*2.5:1;c.globalAlpha=clamp(k*1.6,0,1);txt(c,t.s,t.x,t.y,t.size*sc,t.c,'rgba(40,20,70,.8)');}
 c.globalAlpha=1;
}
function drawGame(c){
 const L=G.L,n=G.lanes,t=G.time;c.save();
 if(G.shake>0)c.translate(rnd(-1,1)*G.shake*.4,rnd(-1,1)*G.shake*.4);
 const tg=target(),showT=G.waiting&&tg>=0;
 for(let i=0;i<n;i++){const x=L.x0+i*L.lw;const col=G.sp>0?NC[(i+Math.floor(t*8))%8]:NC[i];const g=c.createLinearGradient(0,L.hwTop,0,L.kbY);g.addColorStop(0,rgba(col,.03));g.addColorStop(1,rgba(col,.2+G.flash[i]*.35));c.fillStyle=g;c.fillRect(x+1,L.hwTop,L.lw-2,L.kbY-L.hwTop);
  if(showT&&i===tg){c.fillStyle=rgba(NC[i],.12+(G.rung>=1?.12*(1+Math.sin(t*8)):0));c.fillRect(x+1,L.hwTop,L.lw-2,L.kbY-L.hwTop);}}
 c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;c.beginPath();for(let i=1;i<n;i++){const x=L.x0+i*L.lw;c.moveTo(x,L.hwTop);c.lineTo(x,L.kbY);}c.stroke();
 if(G.mode!=='free'&&G.song){const prog=G.mode==='echo'?(G.E?G.E.count/G.E.max:0):clamp((G.t-(LEAD+.6))/(G.songEnd-(LEAD+.6)),0,1);c.fillStyle='rgba(0,0,0,.3)';rr(c,L.x0,L.hwTop-8,L.x1-L.x0,6,3);c.fill();c.fillStyle='#ffd23c';rr(c,L.x0,L.hwTop-8,(L.x1-L.x0)*prog,6,3);c.fill();}
 drawStaff(c);
 c.save();c.beginPath();c.rect(L.x0-40,L.hwTop,L.x1-L.x0+80,L.kbY-L.hwTop);c.clip();
 for(let i=0;i<n;i++){const x=laneX(i),k=G.keyT[i];c.lineWidth=4;c.strokeStyle=rgba(NC[i],.9);c.fillStyle=k>0?rgba(NC[i],.25+k*.45):'rgba(255,255,255,.07)';c.beginPath();c.arc(x,L.hitY,L.padR,0,TAU);c.fill();c.stroke();}
 if(G.mode==='learn'||G.mode==='play')drawNotes(c);
 if(G.mode==='echo')drawEcho(c);
 c.restore();
 drawKeys(c,tg,showT);
 let handLane=-1;
 if(G.demo&&G.waiting){const p=pending();if(p)handLane=p.i;}
 else if(G.tutHand&&G.mode==='learn'){const p=pending();if(p&&G.waiting)handLane=p.i;}
 if(showT&&G.rung>=3)handLane=tg;
 if(handLane>=0){let dy=0;if(G.demo&&G.demo.phase===0){const d=G.demo.t;dy=d>.7&&d<1.1?(d-.7)*60:0;}drawHand(c,laneX(handLane)+L.lw*.08,L.kbY+L.kbH*.6+dy,clamp(L.lw*.7,42,70),G.demo?0:t);}
 if(G.mode==='play'&&G.countT>0){c.globalAlpha=clamp(G.countT/.6,0,1);txt(c,G.countTxt,(L.x0+L.x1)/2,(L.hwTop+L.hitY)/2,78*(1+(.6-G.countT)*.5),'#ffffff','rgba(40,20,70,.8)');c.globalAlpha=1;}
 const pm=G.streak>=10?2:G.streak>=3?1:G.waiting&&G.idle>8?3:0;if(L.staffH)drawPip(c,L.x0+26,L.top+20,17,pm,t);
 c.restore();
 const se=$('#score');if(se&&G.shownScore!==G.score){se.textContent=G.score;G.shownScore=G.score;}
 const me=$('#mult');const mult=G.mode==='play'?Math.min(4,1+Math.floor(G.streak/8))*(G.sp>0?2:1):1;if(me&&G.shownMult!==mult){me.textContent=mult>1?'x'+mult:'';G.shownMult=mult;}
 const lb=$('#listenBtn');const want=G.mode==='echo'&&G.waiting&&G.rung>=1;if(lb&&want!==G.pulseShown){lb.classList.toggle('pulse',want);G.pulseShown=want;}
}
function drawNotes(c){
 const L=G.L,t=G.time,lab=S.settings.labels!=='none';
 for(let k=Math.max(0,G.pi-6);k<G.notes.length;k++){const n=G.notes[k];const y=L.hitY-(n.t-G.t)*L.pps;if(y<L.hwTop-L.padR*3)break;
  const x=laneX(n.i),r=L.padR*.92;const tailLen=n.beats>=2?n.dur*.75*L.pps:0;
  if(tailLen&&!n.miss&&!n.cut){const held=G.hold[n.i]&&G.hold[n.i].n===n;const y0=held?L.hitY:y;const y1=y-tailLen;if(y1<y0){c.fillStyle=rgba(NC[n.i],held?.85:.5);rr(c,x-r*.28,y1,r*.56,y0-y1,r*.28);c.fill();}}
  if(n.hit)continue;
  if(n.miss){if(y>L.kbY+r)continue;drawGem(c,x,y,r*.8,NC[n.i],'',false,.25,false,t);continue;}
  const waitingThis=G.waiting&&(n===G.waitNote||(G.mode==='learn'&&k===G.pi));
  if(!waitingThis&&G.mode==='play'){const tg=c.createLinearGradient(x,y,x,y-r*2.6);tg.addColorStop(0,rgba(NC[n.i],.5));tg.addColorStop(1,rgba(NC[n.i],0));c.fillStyle=tg;c.beginPath();c.moveTo(x-r*.7,y);c.lineTo(x+r*.7,y);c.lineTo(x,y-r*2.6);c.closePath();c.fill();}
  let bx=0;if(n.bounce>0){n.bounce=Math.max(0,n.bounce-.04);bx=Math.sin(n.bounce*30)*6*n.bounce;}
  const col=G.sp>0?NC[(n.i+Math.floor(t*8))%8]:NC[n.i];
  drawGem(c,x+bx,y,r,col,lab?noteLabel(n.i):'',n.gold,1,waitingThis,t);
 }
}
function drawEcho(c){
 const L=G.L,E=G.E,t=G.time;if(!E)return;const cxm=(L.x0+L.x1)/2;const midY=L.hwTop+(L.hitY-L.hwTop)*.42;
 const msg=E.phase==='listen'?'Listen!':E.phase==='turn'?'Your turn!':'';
 const pr=clamp((L.hitY-L.hwTop)*.16,20,44);drawPip(c,cxm,midY-pr*1.4,pr,E.phase==='gap'?2:E.phase==='listen'?0:1,t);
 if(msg)txt(c,msg,cxm,midY+pr*.4,clamp(pr*.8,22,36),'#ffffff','rgba(40,20,70,.8)');
 const len=E.seq.length;if(!len)return;const dr=clamp((L.x1-L.x0)/(len*3),12,26);const gap=dr*2.8;const x0=cxm-(len-1)*gap/2,dy=midY+pr*1.6;
 for(let k=0;k<len;k++){const x=x0+k*gap,n=E.seq[k];let fill=null;
  if(E.phase==='listen'&&E.lit[k])fill=NC[n.i];if(E.phase!=='listen'&&k<E.k)fill=NC[n.i];if(E.phase==='gap')fill=NC[n.i];
  c.lineWidth=4;c.strokeStyle=E.phase==='turn'&&k===E.k?`rgba(255,255,255,${.6+.4*Math.sin(t*6)})`:'rgba(255,255,255,.5)';c.fillStyle=fill||'rgba(255,255,255,.12)';c.beginPath();c.arc(x,dy,dr*(fill&&E.phase!=='gap'&&k===(E.phase==='listen'?E.playI-1:E.k-1)?1.15:1),0,TAU);c.fill();c.stroke();}
}
function drawKeys(c,tg,showT){
 const L=G.L,n=G.lanes,t=G.time;
 c.fillStyle='#241a3a';rr(c,L.x0-6,L.kbY-10,L.x1-L.x0+12,L.kbH+14,14);c.fill();c.fillStyle='#ff5a6e';c.fillRect(L.x0,L.kbY-4,L.x1-L.x0,3);
 for(let i=0;i<n;i++){
  const k=G.keyT[i],wob=G.wob[i]?Math.sin(t*45)*4*G.wob[i]:0;const x=L.x0+i*L.lw+2+wob,w=L.lw-4,y=L.kbY+k*5,h=L.kbH-k*5;const col=NC[i];
  const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,k>0?mix(col,'#ffffff',.55):'#ffffff');g.addColorStop(1,k>0?mix(col,'#ffffff',.25):'#e6dff4');c.fillStyle=g;rr(c,x,y,w,h,10);c.fill();
  if(showT&&i===tg){const pulse=G.rung>=1?.5+.5*Math.sin(t*8):.35;c.lineWidth=G.rung>=1?6:4;c.strokeStyle=rgba(col,.5+pulse*.5);rr(c,x+2,y+2,w-4,h-4,10);c.stroke();if(G.rung>=1){c.fillStyle=rgba(col,.15+pulse*.25);rr(c,x,y,w,h,10);c.fill();}}
  c.fillStyle=col;rr(c,x+6,y+h-20,w-12,12,6);c.fill();
  const lab=noteLabel(i);if(lab)txt(c,lab,x+w/2,y+h-40,clamp(w*(lab.length>2?.3:.42),16,34),mix(col,'#2a1650',.35));
 }
 const bw=L.lw*.56,bh=L.kbH*.52;for(const k of[0,1,3,4,5]){if(k+1>=n)continue;const bx=L.x0+(k+1)*L.lw-bw/2;c.fillStyle='#241a3a';rr(c,bx,L.kbY-2,bw,bh,6);c.fill();c.fillStyle='rgba(255,255,255,.14)';rr(c,bx+bw*.2,L.kbY+4,bw*.6,4,2);c.fill();}
}
function drawStaff(c){
 const L=G.L;if(!L.staffH)return;const x0=L.x0+56,x1=L.x1,top=L.top;const h=L.staffH;
 c.fillStyle='rgba(255,255,255,.93)';rr(c,x0,top,x1-x0,h,14);c.fill();
 const gap=(h-10)/6.4,bot=top+5+gap*4.7;
 c.strokeStyle='#8f84b0';c.lineWidth=1.5;c.beginPath();for(let k=0;k<5;k++){const y=bot-k*gap;c.moveTo(x0+12,y);c.lineTo(x1-12,y);}c.stroke();
 let list=[];
 if(G.mode==='free')list=G.hist.slice(-8).map(i=>({i}));
 else{for(let k=G.pi;k<G.notes.length&&list.length<8;k++){const n=G.notes[k];if(!n.hit&&!n.miss)list.push(n);}}
 const slot=(x1-x0-40)/8;const posOf=[-2,-1,0,1,2,3,4,5];
 list.forEach((n,j)=>{const idx=G.mode==='free'?j+(8-list.length):j;const x=x0+30+idx*slot+slot*.3;const y=bot-posOf[n.i]*gap/2;const cur=G.mode==='free'?j===list.length-1:j===0;
  if(cur){c.fillStyle=rgba(NC[n.i],.22);c.beginPath();c.arc(x,y,gap*1.25,0,TAU);c.fill();}
  if(n.i===0){c.strokeStyle='#8f84b0';c.lineWidth=1.5;c.beginPath();c.moveTo(x-gap*1.1,y);c.lineTo(x+gap*1.1,y);c.stroke();}
  c.save();c.translate(x,y);c.rotate(-.35);c.fillStyle=NC[n.i];c.beginPath();c.ellipse(0,0,gap*.72,gap*.5,0,0,TAU);c.fill();c.lineWidth=1.5;c.strokeStyle='#3a2163';c.stroke();c.restore();
  c.strokeStyle='#3a2163';c.lineWidth=1.6;c.beginPath();if(n.i<4){c.moveTo(x+gap*.66,y-gap*.1);c.lineTo(x+gap*.66,y-gap*3);}else{c.moveTo(x-gap*.66,y+gap*.1);c.lineTo(x-gap*.66,y+gap*3);}c.stroke();
  if(cur&&S.settings.labels!=='none'){c.fillStyle='rgba(255,255,255,.95)';}
 });
 const cur=list.length?(G.mode==='free'?list[list.length-1]:list[0]):null;
 if(cur&&S.settings.labels!=='none'){txt(c,noteLabel(cur.i),x0-28,top+h-14,24,NC[cur.i],'rgba(40,20,70,.7)');}
}

/* ---------- loop ---------- */
let last=0,slow=0;
function update(dt){
 if(G.scr==='game'){if(G.mode==='learn')updLearn(dt);else if(G.mode==='play')updPlay(dt);else if(G.mode==='echo')updEcho(dt);if(G.mode!=='free')hintTick(dt);}
}
function step(dt){G.time+=dt;updFx(dt);update(dt);}
function frame(ts){
 requestAnimationFrame(frame);
 const raw=last?(ts-last)/1000:.016;last=ts;const dt=Math.min(.05,Math.max(0,raw));
 if(raw<.2){if(raw>.026)slow++;else slow=Math.max(0,slow-1);if(slow>90&&DPR>1){dprCap=Math.max(1,DPR-.5);slow=0;resize();}}
 try{if(G.manual){updFx(0);}else step(dt);render(dt);}catch(e){console.error(e);try{goHome();}catch(_){}}
}
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>setTimeout(resize,250));
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopVoices();try{speechSynthesis.cancel();}catch(e){}}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- boot ---------- */
load();resize();
G.scr='home';renderUI();
setTimeout(()=>{if(!S.seen.hello){S.seen.hello=1;save();}},0);
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

window.SK={G,get S(){return S;},SONGS,api:{start:startRound,free:startFree,press,release,step,endRound,goHome,show,appIcon,manual(b){G.manual=!!b;},suggest,totalStars,reload:()=>{load();renderUI();},help}};
})();
</script>
