<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Cribbage Room</title>
<meta name="description" content="Play cribbage against the house, keep score for a real game, or count a hand by photo.">
<meta name="theme-color" content="#241611">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cribbage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="home-board" id="homeBoard" aria-hidden="true"></div>
    <h1 class="wordmark">The Cribbage Room</h1>
    <p class="lede">A New York chophouse with a card table in the back. Loser settles the check.</p>
    <div class="menu">
      <button class="door" data-go="pick">
        <span class="door-t">Play the house</span>
        <span class="door-b">Walt, Sal or Vinnie deal you in</span>
      </button>
      <button class="door" data-go="keeper">
        <span class="door-t">Keep score</span>
        <span class="door-b">Peg a real game played with real cards</span>
      </button>
      <button class="door" data-go="counter">
        <span class="door-t">Count a hand</span>
        <span class="door-b">Pick five cards or snap a photo</span>
      </button>
    </div>
    <button class="linkish" id="resume" hidden></button>
  </section>

  <!-- OPPONENT PICK -->
  <section id="pick" class="screen" hidden>
    <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2>Who's at the table</h2><span></span></header>
    <div id="seats"></div>
  </section>

  <!-- PLAY -->
  <section id="table" class="screen" hidden>
    <header class="bar">
      <button class="back" id="leave" aria-label="Leave table">‹</button>
      <div class="vs" id="vsLine"></div>
      <button class="iconbtn" id="gear" aria-label="Table settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5Z"/></svg>
      </button>
    </header>
    <div class="board-wrap" id="board"></div>
    <div class="scoreline">
      <div class="sc you"><span class="sc-n" id="sy">0</span><span class="sc-l">You</span></div>
      <div class="sc opp"><span class="sc-l" id="oname">Sal</span><span class="sc-n" id="so">0</span></div>
    </div>
    <div class="talk" id="talk" aria-live="polite"><span class="talk-who" id="talkWho"></span><span id="talkText"></span></div>
    <div class="hand opp-hand" id="oppHand"></div>
    <div class="mat" id="mat">
      <div class="mat-side">
        <div class="deckpile" id="deckPile"><div class="card back"></div></div>
        <div class="mat-cap" id="starterCap">Cut</div>
      </div>
      <div class="stack" id="stack"></div>
      <div class="count" id="count"><span id="countN">0</span><span class="mat-cap">Count</span></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hand my-hand" id="myHand"></div>
    <div class="actions" id="actions"></div>
  </section>

  <!-- SCORE KEEPER -->
  <section id="keeper" class="screen" hidden>
    <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2>Keep score</h2><button class="iconbtn" id="kMenu" aria-label="Game options">⋯</button></header>
    <div class="board-wrap" id="kBoard"></div>
    <div class="kplayers" id="kPlayers"></div>
    <div class="kpad" id="kPad"></div>
    <div class="krow">
      <button class="btn" id="kUndo">Undo</button>
      <button class="btn" id="kDeal">Pass the deal</button>
      <button class="btn gold" id="kCount">Count a hand</button>
    </div>
    <details class="ledger"><summary>Score log</summary><ol id="kLog"></ol></details>
  </section>

  <!-- HAND COUNTER (sheet; used alone and from the score keeper) -->
  <section id="counter" class="screen" hidden>
    <header class="bar"><button class="back" id="cBack" aria-label="Back">‹</button><h2 id="cTitle">Count a hand</h2><span></span></header>
    <div class="slots" id="cSlots"></div>
    <div class="ctoggles">
      <button class="pill" id="cCrib" aria-pressed="false">This is the crib</button>
      <button class="pill" id="cClear">Clear</button>
    </div>
    <button class="btn scan" id="cScan">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
      Scan cards with the camera
    </button>
    <input type="file" id="cFile" accept="image/*" capture="environment" hidden>
    <div class="picker" id="cPicker"></div>
    <div class="cresult" id="cResult"></div>
  </section>
</div>

<div id="fx" aria-hidden="true"></div>
<div id="overlay" hidden></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="vision.js"></script>
<script src="play.js"></script>
<script src="keeper.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
